[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceskb"
version = "0.1.0"
description = "Clinical Study Endpoint Knowledge Base: controlled vocabularies for endpoint structure, grounded in public registry data and projected to CDISC USDM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
usdm = ["usdm>=0.66"]

[project.scripts]
ceskb = "ceskb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
