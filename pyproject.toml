[project]
name = "clinical-endpoints"
version = "0.1.0"
description = "A controlled-vocabulary endpoint library, conformance pipeline and USDM 4.0 projection for clinical study endpoints, sourced from AACT or the ClinicalTrials.gov API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    # Bulk-loading raw/conformed rows through an Arrow table instead of
    # DuckDB's scalar parameter binding (db.py's `bulk_insert`) -- with
    # neither pyarrow nor pandas installed, DuckDB's Python client re-probes
    # for them on every bound value, and a failed `import` isn't cached by
    # CPython, so that probe re-walks the whole of sys.path per value. That
    # made executemany-based inserts the dominant cost of both `pull` and
    # `conform` on any real-sized warehouse.
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
# The USDM API only. Kept optional so the pipeline installs without a web stack;
# `endpoints serve` tells you to add it when it is missing.
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
endpoints = "clinical_endpoints.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_endpoints"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
]
