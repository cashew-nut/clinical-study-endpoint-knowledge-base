[project]
name = "clinical-endpoints"
version = "0.1.0"
description = "Ontology + graph pipeline for clinical trial endpoints, sourced from AACT or the ClinicalTrials.gov API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
endpoints = "clinical_endpoints.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_endpoints"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
