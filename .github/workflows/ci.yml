name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate vocabularies and rule packs
        run: ceskb validate

      - name: Fixtures are up to date with their generator
        run: |
          python scripts/make_fixtures.py
          git diff --exit-code data/fixtures/

      - name: Tests
        run: pytest -q

      - name: End-to-end pipeline
        run: |
          ceskb refresh --source fixtures
          ceskb stats
          ceskb export

      # Coverage is not accuracy. This is the gate that measures whether a
      # classification is right, rather than merely made. Precision is checked per
      # concept, not on the average, so one concept mapping badly cannot hide behind
      # forty that map well; --max-excluded guards the denominator, since a score over a
      # shrinking scored set stops meaning anything.
      - name: Accuracy against the gold set
        run: ceskb evaluate --min-accuracy 0.95 --min-precision 0.95 --max-excluded 0

      - name: Gold set is up to date with its generator
        run: |
          python scripts/make_gold_seed.py
          git diff --exit-code review/gold/
