name: Refresh knowledge base

# Weekly incremental pull from ClinicalTrials.gov, reclassify and re-project.
# Requires the runner to be able to reach clinicaltrials.gov.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "Study source"
        type: choice
        options: [ctgov, fixtures]
        default: ctgov
      max_studies:
        description: "Cap studies pulled (blank for no cap)"
        type: string
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Validate vocabularies
        run: ceskb validate

      - name: Restore previous database
        uses: actions/cache/restore@v4
        with:
          path: data/ceskb.duckdb
          key: ceskb-db-${{ github.run_id }}
          restore-keys: ceskb-db-

      - name: Probe the source schema
        if: ${{ (github.event.inputs.source || 'ctgov') == 'ctgov' }}
        run: ceskb probe --source ctgov --limit 50
        continue-on-error: true

      - name: Incremental refresh
        run: |
          ARGS="--source ${{ github.event.inputs.source || 'ctgov' }} --incremental"
          if [ -n "${{ github.event.inputs.max_studies }}" ]; then
            ARGS="$ARGS --max-studies ${{ github.event.inputs.max_studies }}"
          fi
          ceskb refresh $ARGS

      - name: Summary
        run: |
          ceskb stats | tee stats.json
          {
            echo '### Knowledge base refresh'
            echo '```json'
            cat stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export artefacts
        run: ceskb export

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/ceskb.duckdb
          key: ceskb-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: ceskb-exports
          path: data/exports/
          retention-days: 30
