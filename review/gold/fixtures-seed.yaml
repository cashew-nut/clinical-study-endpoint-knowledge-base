  concept_id: HRQOL_CFB
  text: Change From Baseline in St George's Respiratory Questionnaire Total Score at Week 24
  source_hash: a7251556e49e52a5e2617ecbe45102ca
  axes:
    endpoint_form: change_from_baseline
    direction: decrease_is_better
  difficulty: judgement
  note: SGRQ scores higher for worse health, so a fall is improvement -- the opposite of the generic quality-of-life
    convention. Annotated deliberately to test whether instrument-specific direction survives.
- outcome_uid: SYNTH-0005:primary:0
  concept_id: FEV1_PCT_PREDICTED
  text: Absolute Change From Baseline in Percent Predicted FEV1 (ppFEV1) at Week 24
  source_hash: 470379988aa211380929056a49c3b9e0
  axes:
    endpoint_form: change_from_baseline
    reference_type: patient_baseline
  difficulty: judgement
  note: Two references are in play. 'Percent predicted' references the measurement to a population norm;
    the endpoint then compares that quantity to the participant's own baseline. The reference_type axis
    describes the endpoint's comparison, so it is patient_baseline, and the population norm is a property
    of how the measurement is expressed. Annotated population_normative on the first pass by carrying
    over the concept's framing without separating the two.
