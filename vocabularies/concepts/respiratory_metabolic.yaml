concepts:
  # ---------------- respiratory ----------------
  - concept_id: FEV1_CFB
    label: Change from baseline in FEV1
    definition: >-
      The difference between a participant's forced expiratory volume in one second at a
      specified timepoint and their own pre-treatment baseline value.
    synonyms: ["change from baseline in FEV1", "FEV1 change from baseline", "change in FEV1", "trough FEV1 change from baseline"]
    therapeutic_areas: [respiratory]
    structure:
      endpoint_form: change_from_baseline
      measurement_concept: fev1
      reference_type: patient_baseline
      direction: increase_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [litre, millilitre]
    usdm_hints:
      objective_text_template: "To demonstrate the effect of [IntArm] on lung function compared with [CtlArm]."
      endpoint_text_template: "Change from baseline in FEV1 at [Timepoint], where baseline is the value recorded at [BaselineActivity]."
      suggested_activity_labels: ["Spirometry"]
    notes: >-
      Whether the measurement is trough, peak, or post-bronchodilator is a protocol choice
      that changes the value substantially. It is captured in Layer B as a qualifier on the
      baseline and assessment activities rather than as separate concepts.
    status: reviewed

  - concept_id: FEV1_PCT_PREDICTED
    label: FEV1 percent predicted
    definition: >-
      FEV1 expressed as a percentage of the value predicted for a healthy person of the
      same age, sex, height, and ethnicity by a named reference equation.
    synonyms: ["FEV1 percent predicted", "ppFEV1", "percent predicted FEV1", "FEV1 % predicted"]
    therapeutic_areas: [respiratory]
    structure:
      endpoint_form: absolute_value_at_timepoint
      measurement_concept: fev1
      reference_type: population_normative
      direction: increase_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [percent]
    governing_criteria:
      - name: "GLI reference equations"
        citation: "Quanjer PH et al. Multi-ethnic reference values for spirometry for the 3-95 year age range. Eur Respir J 2012;40:1324-1343."
    related_concepts:
      - { concept_id: FEV1_CFB, relation: variant_of, note: "Same measurement, different reference: population-normative rather than the participant's own baseline." }
    notes: >-
      The reference equation is part of the endpoint definition. Two studies reporting
      percent predicted FEV1 using different equations are not reporting the same
      quantity, which is why reference_type here is population_normative rather than none.
    status: reviewed

  - concept_id: EXACERBATION_RATE
    label: Annualised rate of exacerbations
    definition: >-
      The number of protocol-defined respiratory exacerbations a participant experiences
      per year at risk, analysed as a rate rather than as time to a first event so that
      the full burden of repeated events contributes.
    synonyms: ["annualised exacerbation rate", "annualized exacerbation rate", "rate of exacerbations", "exacerbation rate", "annual rate of moderate or severe exacerbations"]
    therapeutic_areas: [respiratory]
    structure:
      endpoint_form: event_rate
      measurement_concept: respiratory_exacerbation
      reference_type: none
      direction: decrease_is_better
      scale_type: rate
      default_summary_measure: rate_ratio
      default_timepoint_selection: cumulative_over_window
    definitional_threshold:
      kind: event_occurrence
      operator: gte
      value: 1
      applies_to: "protocol-defined exacerbation"
      note: >-
        Severity qualification is definitional in practice: most trials count moderate or
        severe events, where severity is keyed to the treatment required, such as systemic
        corticosteroids or antibiotics for moderate and hospitalisation for severe.
    typical_units: [events_per_patient_year]
    usdm_hints:
      endpoint_text_template: "Annualised rate of [Severity] exacerbations during [Timepoint]."
    status: reviewed

  - concept_id: TIME_TO_FIRST_EXACERBATION
    label: Time to first exacerbation
    definition: Time from the time origin until the first protocol-defined exacerbation.
    synonyms: ["time to first exacerbation", "time to first moderate or severe exacerbation"]
    therapeutic_areas: [respiratory]
    structure:
      endpoint_form: time_to_event
      measurement_concept: respiratory_exacerbation
      reference_type: randomisation_time
      direction: longer_is_better
      scale_type: time_to_event
      default_summary_measure: hazard_ratio
      default_timepoint_selection: first_occurrence
    definitional_threshold: null
    typical_units: [day, week]
    related_concepts:
      - { concept_id: EXACERBATION_RATE, relation: variant_of, note: "Same events, different form. Time-to-first discards all events after the first." }
    status: reviewed

  # ---------------- metabolic ----------------
  - concept_id: HBA1C_CFB
    label: Change from baseline in HbA1c
    definition: >-
      The difference between a participant's glycated haemoglobin at a specified timepoint
      and their own baseline value. The standard efficacy endpoint for glucose-lowering
      therapies.
    synonyms: ["change from baseline in HbA1c", "HbA1c change from baseline", "change in HbA1c", "change in glycated haemoglobin", "change in hemoglobin A1c"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: change_from_baseline
      measurement_concept: hba1c
      reference_type: patient_baseline
      direction: decrease_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [percent, mmol_per_mol]
    usdm_hints:
      objective_text_template: "To compare the effect of [IntArm] with [CtlArm] on glycaemic control."
      endpoint_text_template: "Change from baseline in HbA1c at [Timepoint]."
      suggested_activity_labels: ["HbA1c blood sample"]
    notes: >-
      Reported in both NGSP percent and IFCC mmol/mol. The two are related by a fixed
      linear transform, so unit is recorded per study and normalised on read rather than
      being treated as two concepts.
    status: reviewed

  - concept_id: HBA1C_TARGET_RESPONDER
    label: Proportion achieving HbA1c target
    definition: >-
      The proportion of participants whose glycated haemoglobin falls below a fixed
      clinical target at a specified timepoint. A responder endpoint against an external
      target rather than against the participant's own baseline.
    synonyms: ["proportion achieving HbA1c < 7%", "HbA1c target", "proportion of subjects achieving HbA1c below 7%", "glycaemic target attainment"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: responder_binary
      measurement_concept: hba1c
      reference_type: fixed_clinical_target
      direction: increase_is_better
      scale_type: proportion
      default_summary_measure: risk_difference
      default_timepoint_selection: single_timepoint
    definitional_threshold:
      kind: absolute_value
      operator: lt
      value: 7.0
      unit: percent
      applies_to: "HbA1c at the assessment timepoint"
      note: >-
        Seven percent is the most common target and reflects long-standing guideline
        advice, but 6.5 percent and 8 percent are also used. The value is a protocol
        choice recorded in Layer B; this default records the prevailing convention only.
    typical_units: [percent]
    related_concepts:
      - { concept_id: HBA1C_CFB, relation: variant_of, note: "Same measurement thresholded against an external target instead of analysed as change." }
    status: reviewed

  - concept_id: BODY_WEIGHT_PCT_CFB
    label: Percent change from baseline in body weight
    definition: >-
      Change in body weight expressed as a percentage of the participant's own baseline
      weight. The standard primary endpoint in obesity trials.
    synonyms: ["percent change in body weight", "percentage change from baseline in body weight", "percent weight loss", "% change in body weight"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: percent_change_from_baseline
      measurement_concept: body_weight
      reference_type: patient_baseline
      direction: decrease_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [percent]
    related_concepts:
      - { concept_id: WEIGHT_LOSS_RESPONDER, relation: broader_than }
    status: reviewed

  - concept_id: BODY_WEIGHT_CFB
    label: Change from baseline in body weight
    definition: >-
      The difference between a participant's body weight at a specified timepoint and
      their own baseline weight, in absolute mass units.
    synonyms: ["change from baseline in body weight", "change in body weight", "absolute change in body weight", "weight change from baseline"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: change_from_baseline
      measurement_concept: body_weight
      reference_type: patient_baseline
      direction: decrease_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [kilogram]
    related_concepts:
      - { concept_id: BODY_WEIGHT_PCT_CFB, relation: variant_of, note: "Percent change is the more common primary endpoint in obesity; absolute change is common as a secondary and in diabetes trials." }
    status: reviewed

  - concept_id: WEIGHT_LOSS_RESPONDER
    label: Proportion achieving weight loss threshold
    definition: >-
      The proportion of participants losing at least a specified percentage of their
      baseline body weight.
    synonyms: ["proportion achieving at least 5% weight loss", "weight loss responder", "proportion with ≥5% body weight reduction"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: responder_binary
      measurement_concept: body_weight
      reference_type: patient_baseline
      direction: increase_is_better
      scale_type: proportion
      default_summary_measure: risk_difference
      default_timepoint_selection: single_timepoint
    definitional_threshold:
      kind: relative_change_percent
      operator: decrease_by_at_least
      value: 5.0
      unit: percent
      applies_to: "body weight relative to baseline"
      note: "Thresholds of 5, 10, 15 and 20 percent are all in routine use; 5 percent is the regulatory convention for a clinically meaningful response."
    typical_units: [percent]
    notes: >-
      Direction is increase_is_better because the endpoint is the proportion of
      responders, even though the underlying weight change is decrease_is_better. This
      inversion between measurement direction and endpoint direction is exactly why the
      two are held on separate axes.
    status: reviewed

  - concept_id: CGM_TIME_IN_RANGE
    label: Time in target glucose range
    definition: >-
      The percentage of continuous glucose monitoring time during which a participant's
      interstitial glucose lies within a target range.
    synonyms: ["time in range", "TIR", "percent time in range", "time in target range"]
    therapeutic_areas: [metabolic_endocrine]
    structure:
      endpoint_form: proportion_of_window
      measurement_concept: glucose_interstitial_continuous
      reference_type: fixed_clinical_target
      direction: increase_is_better
      scale_type: proportion
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: cumulative_over_window
    definitional_threshold:
      kind: absolute_value
      operator: between
      value: "3.9-10.0"
      unit: mmol_per_l
      applies_to: "sensor glucose concentration"
      note: "Equivalent to 70 to 180 mg/dL, the internationally agreed target range for time in range."
    typical_units: [percent]
    governing_criteria:
      - name: "International Consensus on Time in Range"
        citation: "Battelino T et al. Clinical targets for continuous glucose monitoring data interpretation. Diabetes Care 2019;42:1593-1603."
    status: reviewed

  - concept_id: LDL_C_PCT_CFB
    label: Percent change from baseline in LDL cholesterol
    definition: >-
      Change in low-density lipoprotein cholesterol expressed as a percentage of the
      participant's own baseline concentration.
    synonyms: ["percent change from baseline in LDL-C", "percentage change in LDL cholesterol", "LDL-C percent change"]
    therapeutic_areas: [metabolic_endocrine, cardiovascular]
    structure:
      endpoint_form: percent_change_from_baseline
      measurement_concept: ldl_cholesterol
      reference_type: patient_baseline
      direction: decrease_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [percent]
    status: reviewed
