concepts:
  - concept_id: ACR20
    label: ACR20 response
    definition: >-
      The proportion of participants achieving at least a 20 percent improvement in tender
      and swollen joint counts together with at least a 20 percent improvement in three of
      the five remaining core measures. A composite responder endpoint: the threshold
      applies to each component separately, not to a summary score.
    synonyms: ["ACR20", "ACR 20", "ACR20 response rate", "American College of Rheumatology 20% response"]
    therapeutic_areas: [rheumatology]
    structure:
      endpoint_form: responder_binary
      measurement_concept: acr_core_component_set
      reference_type: patient_baseline
      direction: increase_is_better
      scale_type: proportion
      default_summary_measure: risk_difference
      default_timepoint_selection: single_timepoint
    definitional_threshold:
      kind: composite_criteria
      operator: gte
      value: 20.0
      unit: percent
      applies_to: "each qualifying core component, relative to that component's own baseline"
      note: >-
        Both tender and swollen joint counts must improve by at least 20 percent, and at
        least three of the remaining five core measures must also improve by at least 20
        percent. Each component is referenced to its own baseline, so a single endpoint
        carries seven distinct participant-level baselines.
    typical_units: [percent]
    governing_criteria:
      - name: "ACR response criteria"
        citation: "Felson DT et al. American College of Rheumatology preliminary definition of improvement in rheumatoid arthritis. Arthritis Rheum 1995;38:727-735."
    components:
      - { label: "Tender joint count", measurement_concept: acr_core_component_set, note: "Required component." }
      - { label: "Swollen joint count", measurement_concept: acr_core_component_set, note: "Required component." }
      - { label: "Patient global assessment of disease activity", measurement_concept: acr_core_component_set }
      - { label: "Physician global assessment of disease activity", measurement_concept: acr_core_component_set }
      - { label: "Patient assessment of pain", measurement_concept: pain_intensity }
      - { label: "Physical function (e.g. HAQ-DI)", measurement_concept: health_related_quality_of_life }
      - { label: "Acute phase reactant (CRP or ESR)", measurement_concept: acr_core_component_set }
    related_concepts:
      - { concept_id: ACR50, relation: variant_of }
      - { concept_id: ACR70, relation: variant_of }
      - { concept_id: DAS28_CFB, relation: often_paired_with }
    usdm_hints:
      objective_text_template: "To compare the efficacy of [IntArm] with [CtlArm] in participants with [Condition]."
      endpoint_text_template: "Proportion of participants achieving an ACR20 response at [Timepoint]."
      suggested_activity_labels: ["Joint count assessment", "Patient-reported outcome questionnaire", "Acute phase reactant blood sample"]
    status: reviewed

  - concept_id: ACR50
    label: ACR50 response
    definition: As ACR20 but requiring at least a 50 percent improvement in each qualifying component.
    synonyms: ["ACR50", "ACR 50", "ACR50 response rate"]
    therapeutic_areas: [rheumatology]
    structure:
