  - concept_id: DAS28_CFB
    label: Change from baseline in DAS28
    definition: >-
      Change in the 28-joint Disease Activity Score from the participant's own baseline.
      Unlike ACR responses this is analysed as a continuous score rather than dichotomised.
    synonyms: ["change from baseline in DAS28", "DAS28 change from baseline", "change in DAS28-CRP"]
    therapeutic_areas: [rheumatology]
    structure:
      endpoint_form: change_from_baseline
      measurement_concept: das28
      reference_type: patient_baseline
      direction: decrease_is_better
      scale_type: continuous
      default_summary_measure: difference_in_ls_means
      default_timepoint_selection: single_timepoint
    definitional_threshold: null
    typical_units: [score_points]
    notes: >-
      DAS28-CRP and DAS28-ESR use different acute phase reactants and are not numerically
      interchangeable. The variant is recorded in Layer B.
    status: reviewed

  - concept_id: PASI75
    label: PASI 75 response
    definition: >-
      The proportion of participants achieving at least a 75 percent reduction in the
      Psoriasis Area and Severity Index from their own baseline.
    synonyms: ["PASI 75", "PASI75", "PASI-75", "PASI 75 response rate", "75% reduction in PASI"]
    therapeutic_areas: [dermatology]
    structure:
      endpoint_form: responder_binary
      measurement_concept: psoriasis_area_severity_index
      reference_type: patient_baseline
      direction: increase_is_better
      scale_type: proportion
      default_summary_measure: risk_difference
      default_timepoint_selection: single_timepoint
    definitional_threshold:
      kind: relative_change_percent
      operator: decrease_by_at_least
      value: 75.0
      unit: percent
      applies_to: "PASI score relative to baseline"
    typical_units: [percent]
    related_concepts:
      - { concept_id: PASI90, relation: variant_of, note: "PASI 90 and PASI 100 have become the common primary endpoints as efficacy standards have risen." }
    status: reviewed

