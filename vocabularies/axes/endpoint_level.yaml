axis_id: endpoint_level
label: Endpoint level
definition: >-
  The role an endpoint plays in a specific study's inferential hierarchy. A Layer B
  property by definition: the same canonical concept is primary in one trial and
  secondary in the next. Maps directly onto the USDM Endpoint.level codelist.
extensible: false
usdm_alignment:
  entity: Endpoint
  attribute: level
  codelist_c_code: C188726
terms:
  - term_id: primary
    label: Primary endpoint
    definition: >-
      The endpoint of greatest importance, forming the basis for concluding whether the
      study met its objective.
    external_mappings:
      - system: CDISC-CT
        code: C94496
        display: Primary Endpoint
        verified: true
        verified_against: "CDISC DDF-RA Deliverables/CT/USDM_CT.xlsx, codelist C188726"
    status: reviewed

  - term_id: secondary
    label: Secondary endpoint
    definition: An endpoint providing supportive information about the effect of the intervention.
    external_mappings:
      - system: CDISC-CT
        code: C139173
        display: Secondary Endpoint
        verified: true
        verified_against: "CDISC DDF-RA Deliverables/CT/USDM_CT.xlsx, codelist C188726"
    status: reviewed

  - term_id: exploratory
    label: Exploratory endpoint
    definition: >-
      An endpoint that may include clinically important events expected to occur too
      infrequently to show a treatment effect, or other exploratory measures.
    synonyms: ["other pre-specified", "other outcome", "tertiary"]
    external_mappings:
      - system: CDISC-CT
        code: C170559
        display: Exploratory Endpoint
        verified: true
        verified_against: "CDISC DDF-RA Deliverables/CT/USDM_CT.xlsx, codelist C188726"
    status: reviewed
