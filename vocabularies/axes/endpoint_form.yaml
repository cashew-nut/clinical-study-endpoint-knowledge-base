axis_id: endpoint_form
label: Endpoint form
definition: >-
  The structural shape of the derived variable that is analysed, independent of what is
  being measured. Form determines the statistical machinery an endpoint requires: a
  time-to-event form implies censoring and a survival model, a responder form implies a
  binary derivation from an underlying continuous measurement, and so on. Form is the
  single most reusable property of an endpoint and is the primary axis of this model.
extensible: true
references:
  - citation: "ICH E9(R1) Addendum on Estimands and Sensitivity Analysis in Clinical Trials"
    note: "Form corresponds to the structural aspect of the 'variable (endpoint)' estimand attribute."
terms:
  - term_id: time_to_event
    label: Time-to-event
    definition: >-
      Elapsed time from a defined origin until the first occurrence of a defined event,
      with censoring for participants who have not experienced the event at analysis.
    synonyms: ["survival", "time to first event", "event-free survival"]
    attributes:
      requires_censoring: true
      requires_event_definition: true
      typical_summary_measures: ["hazard_ratio", "median_time_to_event", "restricted_mean_survival_time_difference"]
    status: reviewed

  - term_id: responder_binary
    label: Responder (binary)
    definition: >-
      A per-participant yes/no derived by applying a threshold rule to one or more
      underlying measurements. The threshold is what makes the endpoint a responder
      endpoint; without it the same measurement is a continuous endpoint.
    synonyms: ["response rate", "responder analysis", "dichotomised endpoint"]
    attributes:
      requires_threshold: true
      derives_from_underlying_measurement: true
      typical_summary_measures: ["risk_difference", "odds_ratio", "risk_ratio", "proportion"]
    status: reviewed

  - term_id: change_from_baseline
    label: Change from baseline
    definition: >-
      The arithmetic difference between a participant's value at a specified timepoint and
      their own baseline value. Requires an explicitly designated baseline activity.
    synonyms: ["CFB", "absolute change from baseline"]
    attributes:
      requires_baseline: true
      typical_summary_measures: ["difference_in_ls_means", "difference_in_means"]
    status: reviewed

  - term_id: percent_change_from_baseline
    label: Percent change from baseline
    definition: >-
      Change from baseline expressed as a proportion of the participant's own baseline
      value. Distinguished from change_from_baseline because it has different
      distributional behaviour and is undefined at a zero baseline.
    synonyms: ["% change from baseline", "relative change from baseline"]
    broader: change_from_baseline
    attributes:
      requires_baseline: true
      typical_summary_measures: ["ratio_of_means", "difference_in_ls_means"]
    status: reviewed

  - term_id: absolute_value_at_timepoint
    label: Absolute value at timepoint
    definition: >-
      The measured value itself at a specified timepoint, with no reference to the
      participant's own earlier value.
    synonyms: ["post-baseline value", "value at week N"]
    attributes:
      requires_baseline: false
      typical_summary_measures: ["difference_in_ls_means", "difference_in_means"]
    status: reviewed

  - term_id: event_rate
    label: Event rate per exposure
    definition: >-
      Count of recurrent events divided by time at risk, yielding a rate per
      participant-year or equivalent. Used where events recur and total burden matters
      more than time to the first one.
    synonyms: ["annualised rate", "exacerbation rate", "rate per patient-year"]
    attributes:
      requires_exposure_denominator: true
      typical_summary_measures: ["rate_ratio"]
    status: reviewed

  - term_id: count
    label: Count
    definition: >-
      A simple tally of events or units per participant over a window, without division by
      exposure time.
    attributes:
      typical_summary_measures: ["rate_ratio", "difference_in_means"]
    status: reviewed

  - term_id: proportion_of_window
    label: Proportion of observation window
    definition: >-
      The fraction of a measurement window during which a participant's value satisfied a
      condition, such as percentage of time in a target range.
    synonyms: ["time in range", "percent of time"]
    attributes:
      requires_threshold: true
      requires_continuous_or_repeated_sampling: true
      typical_summary_measures: ["difference_in_ls_means"]
    status: reviewed

  - term_id: time_averaged_auc
    label: Time-averaged / area under the curve
    definition: >-
      A summary of a participant's trajectory over a window, computed as area under the
      response-time curve, optionally normalised by window length.
    synonyms: ["AUC", "weighted mean over time"]
    attributes:
      requires_repeated_measures: true
      typical_summary_measures: ["difference_in_ls_means"]
    status: reviewed

  - term_id: slope_over_time
    label: Slope over time
    definition: >-
      The rate of change of a measurement across repeated assessments, estimated per
      participant or as a treatment-group slope in a longitudinal model.
    synonyms: ["rate of decline", "annual rate of change"]
    attributes:
      requires_repeated_measures: true
      typical_summary_measures: ["difference_in_ls_means"]
    status: reviewed

  - term_id: ordinal_shift
    label: Ordinal shift
    definition: >-
      Movement across the categories of an ordered scale between two timepoints, analysed
      on the ordinal scale rather than dichotomised.
    synonyms: ["shift analysis", "category shift"]
    attributes:
      typical_summary_measures: ["odds_ratio"]
    status: reviewed

  - term_id: recurrent_event
    label: Recurrent event
    definition: >-
      All occurrences of a repeating event per participant analysed jointly, preserving
      the ordering and timing of events rather than collapsing to a first event or a rate.
    attributes:
      requires_event_definition: true
      typical_summary_measures: ["rate_ratio", "hazard_ratio"]
    status: reviewed

  - term_id: composite_hierarchical
    label: Hierarchical composite
    definition: >-
      Participants are compared pairwise against an ordered hierarchy of outcomes, the
      most severe considered first. Used where components differ greatly in clinical
      importance and a simple time-to-first-event would let a minor component dominate.
    synonyms: ["win ratio", "hierarchical endpoint", "DOOR"]
    attributes:
      requires_component_ordering: true
      typical_summary_measures: ["win_ratio"]
    status: reviewed

  - term_id: composite_any_event
    label: Composite (any component event)
    definition: >-
      A single event defined as the occurrence of any one of several component events,
      each weighted equally. Commonly combined with a time-to-event form.
    synonyms: ["MACE", "composite event", "any of"]
    attributes:
      requires_component_definition: true
    status: reviewed
