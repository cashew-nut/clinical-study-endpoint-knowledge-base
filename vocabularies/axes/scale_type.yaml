axis_id: scale_type
label: Scale type
definition: >-
  The measurement scale of the analysed endpoint variable, which constrains the summary
  measures and analysis models that are admissible. Note this describes the endpoint
  after derivation, not the raw measurement: overall response rate is a proportion even
  though tumour diameters are continuous.
extensible: false
terms:
  - term_id: continuous
    label: Continuous
    definition: A value on an interval or ratio scale that can take any value in a range.
    attributes:
      admissible_summary_measures: ["difference_in_means", "difference_in_ls_means", "ratio_of_means"]
    status: reviewed

  - term_id: proportion
    label: Proportion
    definition: >-
      A fraction of a defined denominator, reported as a percentage or a rate between
      zero and one. The analysis unit is the group, derived from binary participant data.
    attributes:
      admissible_summary_measures: ["risk_difference", "risk_ratio", "odds_ratio", "proportion"]
      bounded: [0, 1]
    status: reviewed

  - term_id: binary
    label: Binary
    definition: A per-participant two-state outcome, before aggregation into a proportion.
    attributes:
      admissible_summary_measures: ["odds_ratio", "risk_ratio", "risk_difference"]
    status: reviewed

  - term_id: time_to_event
    label: Time-to-event
    definition: >-
      A duration subject to right censoring, analysed on the survival scale.
    attributes:
      admissible_summary_measures: ["hazard_ratio", "median_time_to_event", "restricted_mean_survival_time_difference"]
      censored: true
    status: reviewed

  - term_id: count
    label: Count
    definition: A non-negative integer tally.
    attributes:
      admissible_summary_measures: ["rate_ratio", "difference_in_means"]
    status: reviewed

  - term_id: rate
    label: Rate
    definition: A count normalised by time at risk or another exposure denominator.
    attributes:
      admissible_summary_measures: ["rate_ratio"]
    status: reviewed

  - term_id: ordinal
    label: Ordinal
    definition: >-
      Ordered categories without a meaningful metric distance between adjacent levels.
    attributes:
      admissible_summary_measures: ["odds_ratio", "win_ratio"]
    status: reviewed

  - term_id: categorical
    label: Categorical (nominal)
    definition: Unordered categories.
    status: reviewed
