axis_id: timepoint_anchor
label: Timepoint anchor
definition: >-
  The reference event from which an endpoint's assessment time is measured. Separating
  the anchor from the offset is what makes "Week 12" comparable across protocols: week 12
  from randomisation and week 12 from first dose are different assessment times in any
  trial with a run-in period.
extensible: true
usdm_alignment:
  entity: Timing
  attribute: relativeToFrom
  codelist_c_code: C201265
terms:
  - term_id: randomisation
    label: Randomisation
    definition: The point at which the participant was assigned to a treatment group.
    synonyms: ["randomization", "from randomisation"]
    status: reviewed

  - term_id: first_dose
    label: First dose
    definition: First administration of study intervention.
    synonyms: ["treatment start", "day 1", "first administration"]
    status: reviewed

  - term_id: baseline_visit
    label: Baseline visit
    definition: >-
      The designated baseline assessment activity, which may precede first dose by a
      protocol-specified interval.
    synonyms: ["baseline"]
    status: reviewed

  - term_id: screening
    label: Screening
    definition: The screening visit or period.
    status: reviewed

  - term_id: study_enrolment
    label: Enrolment
    definition: >-
      Entry into the study, used in single-arm and observational designs where there is
      no randomisation.
    synonyms: ["enrollment", "study entry", "registration"]
    status: reviewed

  - term_id: end_of_treatment
    label: End of treatment
    definition: The last administration of study intervention or the scheduled treatment-period end.
    synonyms: ["EOT", "treatment discontinuation"]
    status: reviewed

  - term_id: end_of_study
    label: End of study
    definition: The final protocol-defined contact for the participant.
    synonyms: ["EOS", "study completion", "final visit"]
    status: reviewed

  - term_id: index_event
    label: Index clinical event
    definition: >-
      A clinical event that starts the observation window, such as an index myocardial
      infarction, hospital admission, or surgery.
    synonyms: ["index procedure", "index hospitalisation", "symptom onset"]
    status: reviewed

  - term_id: event_driven
    label: Event-driven (no fixed calendar time)
    definition: >-
      Analysis occurs when a target number of events has accrued rather than at a fixed
      elapsed time. The assessment time is a consequence of event accrual, so no offset
      is meaningful.
    synonyms: ["until required number of events", "event-driven analysis"]
    attributes:
      offset_meaningful: false
    status: reviewed

  - term_id: unspecified
    label: Unspecified
    definition: >-
      The source text gives an offset but no anchor. Recorded explicitly rather than
      guessed, so that the ambiguity remains visible downstream.
    attributes:
      is_unresolved: true
    status: reviewed
