axis_id: threshold_operator
label: Threshold operator
definition: >-
  The comparison applied between a derived quantity and a threshold value. Held separately
  from the threshold value so that thresholds are machine-comparable rather than trapped
  in prose such as "at least a 20 percent improvement".
extensible: false
terms:
  - term_id: gte
    label: Greater than or equal to
    definition: The quantity must be at least the threshold value.
    synonyms: ["at least", ">=", "≥", "no less than"]
    attributes: { symbol: ">=" }
    status: reviewed

  - term_id: gt
    label: Greater than
    definition: The quantity must exceed the threshold value.
    synonyms: ["more than", ">", "above"]
    attributes: { symbol: ">" }
    status: reviewed

  - term_id: lte
    label: Less than or equal to
    definition: The quantity must be at most the threshold value.
    synonyms: ["at most", "<=", "≤", "no more than"]
    attributes: { symbol: "<=" }
    status: reviewed

  - term_id: lt
    label: Less than
    definition: The quantity must be below the threshold value.
    synonyms: ["below", "<", "under"]
    attributes: { symbol: "<" }
    status: reviewed

  - term_id: eq
    label: Equal to
    definition: The quantity must equal the threshold value or category.
    attributes: { symbol: "=" }
    status: reviewed

  - term_id: between
    label: Between (inclusive range)
    definition: The quantity must fall within an inclusive lower and upper bound.
    attributes: { symbol: "[]", requires_two_values: true }
    status: reviewed

  - term_id: decrease_by_at_least
    label: Decrease by at least
    definition: >-
      The quantity must fall by at least the threshold magnitude. Kept distinct from gte
      because the sign convention of the underlying change is a frequent source of error.
    synonyms: ["reduction of at least", "improvement of at least", "decrease of ≥"]
    attributes: { symbol: ">=", applies_to_magnitude_of: "decrease" }
    status: reviewed

  - term_id: increase_by_at_least
    label: Increase by at least
    definition: The quantity must rise by at least the threshold magnitude.
    synonyms: ["increase of at least", "gain of at least", "increase of ≥"]
    attributes: { symbol: ">=", applies_to_magnitude_of: "increase" }
    status: reviewed
