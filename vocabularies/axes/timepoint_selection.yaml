axis_id: timepoint_selection
label: Timepoint selection rule
definition: >-
  How the analysed value is chosen from a participant's assessments. Two studies may
  assess at identical visits yet define different endpoints because one takes the value
  at a fixed visit and the other takes each participant's best value across all visits.
extensible: true
terms:
  - term_id: single_timepoint
    label: Single specified timepoint
    definition: The value at one nominated assessment, with a protocol visit window.
    synonyms: ["at week N", "at month N"]
    status: reviewed

  - term_id: best_across_timepoints
    label: Best value across timepoints
    definition: >-
      Each participant contributes their most favourable qualifying value over the
      observation period. Standard for best overall response in oncology and inherently
      optimistic relative to a fixed-visit assessment.
    synonyms: ["best overall response", "best response", "peak response"]
    status: reviewed

  - term_id: last_observation
    label: Last available observation
    definition: The participant's final non-missing assessment in the window.
    synonyms: ["last visit", "LOCF", "final assessment"]
    status: reviewed

  - term_id: all_timepoints_longitudinal
    label: All timepoints (longitudinal model)
    definition: >-
      Every assessment enters a repeated-measures model; the treatment estimate is read
      at a nominated visit or as an overall effect.
    synonyms: ["MMRM", "repeated measures", "over time"]
    status: reviewed

  - term_id: cumulative_over_window
    label: Cumulative over window
    definition: >-
      Assessments are aggregated across the window into a single value, as for counts,
      rates, and areas under the curve.
    synonyms: ["over the treatment period", "during the study", "cumulative"]
    status: reviewed

  - term_id: sustained_over_window
    label: Sustained / confirmed over window
    definition: >-
      A condition must hold at two or more separated assessments to count, as for
      confirmed response or sustained disability progression. Materially more stringent
      than a single-assessment rule.
    synonyms: ["confirmed", "sustained", "maintained for at least"]
    attributes:
      requires_confirmation_interval: true
    status: reviewed

  - term_id: first_occurrence
    label: First occurrence
    definition: The earliest qualifying event, as used by time-to-first-event endpoints.
    status: reviewed

  - term_id: unspecified
    label: Unspecified
    definition: The source text does not determine the selection rule.
    attributes:
      is_unresolved: true
    status: reviewed
