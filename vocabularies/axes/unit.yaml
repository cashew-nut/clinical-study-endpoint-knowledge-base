axis_id: unit
label: Unit of measure
definition: >-
  Units in which endpoint values and thresholds are expressed. UCUM codes are recorded so
  that values carry machine-checkable dimensions; they are marked unverified until checked
  against a UCUM release, because a wrong unit code is worse than an absent one.
extensible: true
terms:
  - term_id: percent
    label: Percent
    definition: A dimensionless proportion expressed per hundred.
    external_mappings: [{ system: UCUM, code: "%", display: percent, verified: false }]
    attributes: { dimension: dimensionless }
    status: reviewed
  - term_id: proportion_unit
    label: Proportion (0-1)
    definition: A dimensionless proportion expressed between zero and one.
    external_mappings: [{ system: UCUM, code: "1", display: unity, verified: false }]
    attributes: { dimension: dimensionless }
    status: reviewed
  - term_id: litre
    label: Litre
    definition: Volume, the standard unit for spirometric volumes such as FEV1 and FVC.
    external_mappings: [{ system: UCUM, code: "L", display: litre, verified: false }]
    attributes: { dimension: volume }
    status: reviewed
  - term_id: millilitre
    label: Millilitre
    definition: Volume, commonly used for spirometric change from baseline.
    external_mappings: [{ system: UCUM, code: "mL", display: millilitre, verified: false }]
    attributes: { dimension: volume }
    status: reviewed
  - term_id: litre_per_second
    label: Litre per second
    definition: Flow rate, used for peak expiratory flow.
    external_mappings: [{ system: UCUM, code: "L/s", display: litre per second, verified: false }]
    attributes: { dimension: flow }
    status: reviewed
  - term_id: mmol_per_mol
    label: Millimole per mole
    definition: IFCC unit for glycated haemoglobin.
    external_mappings: [{ system: UCUM, code: "mmol/mol", display: millimole per mole, verified: false }]
    attributes: { dimension: mass_fraction }
    status: reviewed
  - term_id: mg_per_dl
    label: Milligram per decilitre
    definition: Concentration, conventional units for glucose and lipids in some regions.
    external_mappings: [{ system: UCUM, code: "mg/dL", display: milligram per decilitre, verified: false }]
    attributes: { dimension: mass_concentration }
    status: reviewed
  - term_id: mmol_per_l
    label: Millimole per litre
    definition: Concentration, SI units for glucose and lipids.
    external_mappings: [{ system: UCUM, code: "mmol/L", display: millimole per litre, verified: false }]
    attributes: { dimension: substance_concentration }
    status: reviewed
  - term_id: g_per_dl
    label: Gram per decilitre
    definition: Concentration, conventional units for haemoglobin.
    external_mappings: [{ system: UCUM, code: "g/dL", display: gram per decilitre, verified: false }]
    attributes: { dimension: mass_concentration }
    status: reviewed
  - term_id: mmhg
    label: Millimetre of mercury
    definition: Pressure, the standard unit for blood pressure.
    external_mappings: [{ system: UCUM, code: "mm[Hg]", display: millimetre of mercury, verified: false }]
    attributes: { dimension: pressure }
    status: reviewed
  - term_id: kilogram
    label: Kilogram
    definition: Mass, used for body weight.
    external_mappings: [{ system: UCUM, code: "kg", display: kilogram, verified: false }]
    attributes: { dimension: mass }
    status: reviewed
  - term_id: kg_per_m2
    label: Kilogram per square metre
    definition: Body mass index.
    external_mappings: [{ system: UCUM, code: "kg/m2", display: kilogram per square metre, verified: false }]
    attributes: { dimension: areal_density }
    status: reviewed
  - term_id: centimetre
    label: Centimetre
    definition: Length, used for lesion diameters and waist circumference.
    external_mappings: [{ system: UCUM, code: "cm", display: centimetre, verified: false }]
    attributes: { dimension: length }
    status: reviewed
  - term_id: millimetre
    label: Millimetre
    definition: Length, the RECIST unit for target lesion diameters.
    external_mappings: [{ system: UCUM, code: "mm", display: millimetre, verified: false }]
    attributes: { dimension: length }
    status: reviewed
  - term_id: metre
    label: Metre
    definition: Length, used for walk-test distance.
    external_mappings: [{ system: UCUM, code: "m", display: metre, verified: false }]
    attributes: { dimension: length }
    status: reviewed
  - term_id: ml_per_min_1_73m2
    label: Millilitre per minute per 1.73 square metres
    definition: Body-surface-normalised estimated glomerular filtration rate.
    external_mappings: [{ system: UCUM, code: "mL/min/{1.73_m2}", display: eGFR unit, verified: false }]
    attributes: { dimension: normalised_flow }
    status: reviewed
  - term_id: day
    label: Day
    definition: Duration in days.
    external_mappings: [{ system: UCUM, code: "d", display: day, verified: false }]
    attributes: { dimension: time }
    status: reviewed
  - term_id: week
    label: Week
    definition: Duration in weeks.
    external_mappings: [{ system: UCUM, code: "wk", display: week, verified: false }]
    attributes: { dimension: time }
    status: reviewed
  - term_id: month
    label: Month
    definition: Duration in months, the conventional reporting unit for oncology time-to-event endpoints.
    external_mappings: [{ system: UCUM, code: "mo", display: month, verified: false }]
    attributes: { dimension: time }
    status: reviewed
  - term_id: year
    label: Year
    definition: Duration in years.
    external_mappings: [{ system: UCUM, code: "a", display: year, verified: false }]
    attributes: { dimension: time }
    status: reviewed
  - term_id: events_per_patient_year
    label: Events per patient-year
    definition: Event rate normalised by person-time at risk.
    external_mappings: [{ system: UCUM, code: "1/a", display: per year, verified: false }]
    attributes: { dimension: rate }
    status: reviewed
  - term_id: score_points
    label: Score points
    definition: >-
      Points on a named clinical or patient-reported instrument. Dimensionless and only
      interpretable together with the instrument and its version.
    attributes: { dimension: dimensionless, requires_instrument: true }
    status: reviewed
  - term_id: count_unit
    label: Count
    definition: A dimensionless tally of events or units.
    external_mappings: [{ system: UCUM, code: "1", display: unity, verified: false }]
    attributes: { dimension: dimensionless }
    status: reviewed
  - term_id: letters_etdrs
    label: ETDRS letters
    definition: Letters read on an ETDRS chart, the standard visual acuity endpoint unit.
    attributes: { dimension: dimensionless, requires_instrument: true }
    status: reviewed
  - term_id: log10_copies_per_ml
    label: Log10 copies per millilitre
    definition: Log-transformed viral load concentration.
    external_mappings: [{ system: UCUM, code: "{log10copies}/mL", display: log10 copies per mL, verified: false }]
    attributes: { dimension: log_concentration }
    status: reviewed
