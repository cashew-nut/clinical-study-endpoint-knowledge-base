axis_id: therapeutic_area
label: Therapeutic area
definition: >-
  A coarse clinical grouping used to scope concepts and to disambiguate homographs during
  classification. Deliberately shallow: this axis exists to route and filter, not to
  classify disease, which is the job of a condition terminology such as MedDRA or SNOMED.
extensible: true
terms:
  - term_id: cross_cutting
    label: Cross-cutting
    definition: >-
      Applies across therapeutic areas, as for overall survival, mortality, and generic
      quality-of-life instruments.
    status: reviewed
  - term_id: oncology
    label: Oncology
    definition: Malignant neoplasms and haematological malignancies.
    synonyms: ["cancer", "neoplasm", "tumour", "tumor", "carcinoma", "melanoma", "lymphoma", "leukaemia", "leukemia", "myeloma"]
    status: reviewed
  - term_id: respiratory
    label: Respiratory
    definition: Diseases of the airways and lungs.
    synonyms: ["asthma", "COPD", "pulmonary", "cystic fibrosis", "IPF", "bronchiectasis"]
    status: reviewed
  - term_id: metabolic_endocrine
    label: Metabolic and endocrine
    definition: Disorders of metabolism, glycaemic control, weight, lipids, and endocrine function.
    synonyms: ["diabetes", "obesity", "dyslipidaemia", "dyslipidemia", "thyroid", "NASH", "MASH"]
    status: reviewed
  - term_id: rheumatology
    label: Rheumatology
    definition: Inflammatory and degenerative disorders of joints and connective tissue.
    synonyms: ["rheumatoid arthritis", "psoriatic arthritis", "lupus", "SLE", "axial spondyloarthritis", "osteoarthritis", "gout"]
    status: reviewed
  - term_id: cardiovascular
    label: Cardiovascular
    definition: Disorders of the heart and vasculature.
    synonyms: ["heart failure", "hypertension", "myocardial infarction", "atrial fibrillation", "stroke prevention", "coronary"]
    status: reviewed
  - term_id: neurology
    label: Neurology
    definition: Disorders of the central and peripheral nervous system.
    synonyms: ["multiple sclerosis", "Alzheimer", "Parkinson", "epilepsy", "migraine", "ALS", "neuropathy", "stroke"]
    status: reviewed
  - term_id: psychiatry
    label: Psychiatry and mental health
    definition: Psychiatric and behavioural disorders.
    synonyms: ["depression", "schizophrenia", "bipolar", "anxiety", "PTSD", "ADHD"]
    status: reviewed
  - term_id: infectious_disease
    label: Infectious disease
    definition: Bacterial, viral, fungal, and parasitic infection.
    synonyms: ["HIV", "hepatitis", "influenza", "COVID", "tuberculosis", "sepsis", "pneumonia"]
    status: reviewed
  - term_id: vaccines
    label: Vaccines and prophylaxis
    definition: Preventive immunisation and prophylaxis.
    synonyms: ["immunogenicity", "vaccination", "seroconversion"]
    status: reviewed
  - term_id: dermatology
    label: Dermatology
    definition: Diseases of the skin.
    synonyms: ["psoriasis", "atopic dermatitis", "eczema", "acne", "vitiligo", "urticaria"]
    status: reviewed
  - term_id: nephrology
    label: Nephrology
    definition: Kidney disease and renal function.
    synonyms: ["chronic kidney disease", "CKD", "dialysis", "IgA nephropathy", "diabetic nephropathy"]
    status: reviewed
  - term_id: gastroenterology
    label: Gastroenterology and hepatology
    definition: Disorders of the gastrointestinal tract and liver.
    synonyms: ["Crohn", "ulcerative colitis", "IBD", "IBS", "cirrhosis", "coeliac", "celiac"]
    status: reviewed
  - term_id: haematology
    label: Haematology (non-malignant)
    definition: Non-malignant disorders of blood and haemostasis.
    synonyms: ["haemophilia", "hemophilia", "sickle cell", "thalassaemia", "anaemia", "anemia", "ITP"]
    status: reviewed
  - term_id: ophthalmology
    label: Ophthalmology
    definition: Diseases of the eye and vision.
    synonyms: ["macular degeneration", "AMD", "diabetic retinopathy", "glaucoma", "uveitis", "dry eye"]
    status: reviewed
  - term_id: immunology
    label: Immunology and transplantation
    definition: Immune-mediated disease outside other listed areas, and transplant medicine.
    synonyms: ["transplant", "graft versus host", "GvHD", "immunodeficiency"]
    status: reviewed
  - term_id: pain
    label: Pain and anaesthesia
    definition: Acute and chronic pain, analgesia, and anaesthesia.
    synonyms: ["analgesia", "chronic pain", "postoperative pain", "neuropathic pain"]
    status: reviewed
  - term_id: urology
    label: Urology
    definition: Disorders of the urinary tract and male reproductive system.
    synonyms: ["overactive bladder", "BPH", "incontinence", "erectile dysfunction"]
    status: reviewed
  - term_id: womens_health
    label: Women's health and obstetrics
    definition: Gynaecological, obstetric, and reproductive health.
    synonyms: ["endometriosis", "contraception", "menopause", "preterm birth", "fibroids"]
    status: reviewed
  - term_id: rare_disease
    label: Rare and genetic disease
    definition: Rare, inherited, and metabolic genetic disorders not better placed elsewhere.
    synonyms: ["Duchenne", "spinal muscular atrophy", "Fabry", "Gaucher", "amyloidosis"]
    status: reviewed
