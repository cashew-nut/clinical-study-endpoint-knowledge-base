axis_id: summary_measure
label: Population-level summary measure
definition: >-
  The statistic that summarises the endpoint across participants to give the treatment
  comparison. This is the fifth estimand attribute in ICH E9(R1) and is the level at
  which trial results are actually reported and pooled.
extensible: true
references:
  - citation: "ICH E9(R1), estimand attribute: population-level summary"
terms:
  - term_id: hazard_ratio
    label: Hazard ratio
    definition: Ratio of instantaneous event hazards between groups under a proportional hazards assumption.
    synonyms: ["HR"]
    attributes: { null_value: 1.0, scale: ratio, requires_scale_type: time_to_event }
    status: reviewed

  - term_id: median_time_to_event
    label: Median time to event
    definition: The Kaplan-Meier median time, reported per group and often as a difference.
    synonyms: ["median PFS", "median survival", "median OS"]
    attributes: { scale: duration, requires_scale_type: time_to_event }
    status: reviewed

  - term_id: restricted_mean_survival_time_difference
    label: Restricted mean survival time difference
    definition: >-
      Difference in area under the survival curves up to a specified horizon. Avoids the
      proportional hazards assumption.
    synonyms: ["RMST difference"]
    attributes: { null_value: 0.0, scale: duration, requires_horizon: true }
    status: reviewed

  - term_id: odds_ratio
    label: Odds ratio
    definition: Ratio of the odds of the outcome between groups.
    synonyms: ["OR"]
    attributes: { null_value: 1.0, scale: ratio }
    status: reviewed

  - term_id: risk_ratio
    label: Risk ratio
    definition: Ratio of the probability of the outcome between groups.
    synonyms: ["relative risk", "RR"]
    attributes: { null_value: 1.0, scale: ratio }
    status: reviewed

  - term_id: risk_difference
    label: Risk difference
    definition: Absolute difference in outcome probability between groups.
    synonyms: ["absolute risk reduction", "ARR", "rate difference"]
    attributes: { null_value: 0.0, scale: difference }
    status: reviewed

  - term_id: proportion
    label: Proportion (single group)
    definition: >-
      The within-group proportion itself, reported without a between-group contrast. The
      usual summary for single-arm studies.
    attributes: { scale: proportion, single_group: true }
    status: reviewed

  - term_id: difference_in_means
    label: Difference in means
    definition: Unadjusted arithmetic difference between group means.
    attributes: { null_value: 0.0, scale: difference }
    status: reviewed

  - term_id: difference_in_ls_means
    label: Difference in least-squares means
    definition: >-
      Model-adjusted difference between group means, typically from an analysis of
      covariance or a mixed model for repeated measures.
    synonyms: ["LS mean difference", "adjusted mean difference", "treatment difference"]
    attributes: { null_value: 0.0, scale: difference, model_adjusted: true }
    status: reviewed

  - term_id: ratio_of_means
    label: Ratio of means
    definition: >-
      Ratio of group means or geometric means, used where the endpoint is analysed on a
      log scale.
    synonyms: ["geometric mean ratio", "fold change"]
    attributes: { null_value: 1.0, scale: ratio }
    status: reviewed

  - term_id: rate_ratio
    label: Rate ratio
    definition: Ratio of event rates between groups, typically from a negative binomial or Poisson model.
    synonyms: ["incidence rate ratio", "IRR"]
    attributes: { null_value: 1.0, scale: ratio, requires_scale_type: rate }
    status: reviewed

  - term_id: win_ratio
    label: Win ratio
    definition: >-
      Ratio of wins to losses across all pairwise comparisons under a hierarchy of
      component outcomes.
    attributes: { null_value: 1.0, scale: ratio, requires_component_ordering: true }
    status: reviewed

  - term_id: unspecified
    label: Unspecified
    definition: >-
      The summary measure is not determinable from the available source. Recorded rather
      than defaulted, because a wrong default silently misstates a result.
    attributes: { is_unresolved: true }
    status: reviewed
