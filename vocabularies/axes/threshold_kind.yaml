axis_id: threshold_kind
label: Threshold kind
definition: >-
  What quantity a responder threshold is applied to. The same numeric threshold means
  entirely different things depending on kind: a 30 percent relative reduction and a
  30 unit absolute reduction share a number and nothing else.
extensible: true
terms:
  - term_id: relative_change_percent
    label: Relative change (percent of reference)
    definition: >-
      The threshold applies to change expressed as a percentage of the reference value,
      as in a 30 percent decrease in the sum of target lesion diameters.
    attributes:
      requires_reference: true
      unit_family: dimensionless_percent
    status: reviewed

  - term_id: absolute_change
    label: Absolute change (measurement units)
    definition: >-
      The threshold applies to change in the measurement's own units, as in a 100 mL
      increase in FEV1 or a 4 point reduction on a symptom scale.
    attributes:
      requires_reference: true
      unit_family: measurement_native
    status: reviewed

  - term_id: absolute_value
    label: Absolute attained value
    definition: >-
      The threshold applies to the value itself rather than to change, as in attaining
      HbA1c below 7 percent.
    attributes:
      requires_reference: false
      unit_family: measurement_native
    status: reviewed

  - term_id: category_attainment
    label: Category attainment
    definition: >-
      The threshold is membership of a named category on an ordinal or criteria-based
      scale, as in achieving complete or partial response under RECIST.
    attributes:
      requires_category_definition: true
    status: reviewed

  - term_id: composite_criteria
    label: Composite criteria set
    definition: >-
      Qualification requires several component conditions to hold together, as in ACR20
      where two core components and a proportion of the remainder must each improve.
    attributes:
      requires_component_rules: true
    status: reviewed

  - term_id: event_occurrence
    label: Event occurrence
    definition: >-
      Qualification is the occurrence of a defined event, with no numeric threshold.
    status: reviewed
