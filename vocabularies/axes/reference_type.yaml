axis_id: reference_type
label: Reference type
definition: >-
  What a measured value is compared against to become an endpoint value. This is the axis
  most often left implicit in registry text and most often a source of silent
  incomparability between studies: two trials reporting "change in FEV1" are not
  measuring the same thing if one references a pre-dose baseline and the other a
  population-predicted normal.
extensible: true
terms:
  - term_id: patient_baseline
    label: Participant's own baseline value
    definition: >-
      The participant's value at a designated baseline activity, most often the last
      non-missing assessment before first dose or randomisation.
    synonyms: ["baseline", "pre-treatment value"]
    attributes:
      requires_named_baseline_activity: true
    status: reviewed

  - term_id: randomisation_time
    label: Time of randomisation
    definition: >-
      The randomisation timestamp used as the time origin for a time-to-event endpoint.
      A temporal rather than a value reference.
    synonyms: ["from randomisation", "randomization"]
    attributes:
      temporal_origin: true
    status: reviewed

  - term_id: first_dose_time
    label: Time of first dose
    definition: >-
      The first administration of study intervention used as the time origin. Differs
      materially from randomisation in trials with a lag between the two.
    synonyms: ["from first dose", "treatment start"]
    attributes:
      temporal_origin: true
    status: reviewed

  - term_id: screening_value
    label: Screening value
    definition: >-
      A value recorded at screening, used where screening rather than a later pre-dose
      assessment anchors the comparison.
    status: reviewed

  - term_id: best_previous_value
    label: Best or worst previous value (nadir)
    definition: >-
      The most extreme value observed so far for that participant, used where progression
      is defined relative to the best response achieved rather than to baseline. Central
      to RECIST progression, where growth is measured from the nadir sum of diameters.
    synonyms: ["nadir", "best response to date"]
    status: reviewed

  - term_id: population_normative
    label: Population normative / predicted value
    definition: >-
      A value predicted for a demographically matched healthy reference population, so
      that the endpoint expresses a departure from expected rather than from the
      participant's own history. Percent-predicted spirometry is the canonical case.
    synonyms: ["percent predicted", "predicted normal", "z-score"]
    attributes:
      requires_reference_equation: true
    status: reviewed

  - term_id: fixed_clinical_target
    label: Fixed clinical target
    definition: >-
      An externally fixed clinical value that does not depend on the participant or the
      population, such as attaining HbA1c below 7 percent.
    synonyms: ["target attainment", "goal attainment"]
    status: reviewed

  - term_id: comparator_arm
    label: Comparator arm
    definition: >-
      The endpoint is defined relative to the concurrent control group rather than to any
      within-participant reference.
    status: reviewed

  - term_id: none
    label: No reference
    definition: >-
      The measured value stands alone; no reference value or time origin is part of the
      endpoint definition.
    status: reviewed
