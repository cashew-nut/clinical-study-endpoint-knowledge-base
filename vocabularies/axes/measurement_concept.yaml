axis_id: measurement_concept
label: Measurement concept
definition: >-
  What is physically or clinically observed, before any derivation into an endpoint. Held
  separately from endpoint form because the same measurement supports many endpoints:
  FEV1 underlies change from baseline, percent predicted, responder rates, and rate of
  decline. Modality on each term is the hook for the future procedure and equipment layer.
extensible: true
terms:
  # ---- cross-cutting -------------------------------------------------------
  - term_id: death_any_cause
    label: Death from any cause
    definition: Occurrence of death irrespective of cause.
    synonyms: ["all-cause mortality", "overall survival", "death"]
    attributes: { modality: survival_status, unit_family: event }
    status: reviewed
  - term_id: death_cause_specific
    label: Cause-specific death
    definition: Death attributed to a specified cause, requiring cause-of-death assessment.
    synonyms: ["cardiovascular death", "cancer-specific mortality", "disease-related death"]
    broader: death_any_cause
    attributes: { modality: event_adjudication, unit_family: event }
    status: reviewed
  - term_id: hospitalisation
    label: Hospitalisation
    definition: An admission to hospital, optionally restricted to a specified cause.
    synonyms: ["hospitalization", "hospital admission", "inpatient admission"]
    attributes: { modality: healthcare_utilisation, unit_family: event }
    status: reviewed
  - term_id: adverse_event_occurrence
    label: Adverse event occurrence
    definition: Occurrence of an untoward medical event, coded to a standard dictionary.
    synonyms: ["treatment-emergent adverse event", "TEAE", "adverse events", "safety"]
    attributes: { modality: clinician_reported, unit_family: event, requires_coding_dictionary: "MedDRA" }
    status: reviewed
  - term_id: health_related_quality_of_life
    label: Health-related quality of life
    definition: A multi-domain self-reported assessment of health status and wellbeing.
    synonyms: ["HRQoL", "quality of life", "EQ-5D", "SF-36", "PROMIS"]
    attributes: { modality: patient_reported, unit_family: score, requires_instrument: true }
    status: reviewed

  # ---- oncology ------------------------------------------------------------
  - term_id: tumour_burden_recist
    label: Tumour burden by RECIST
    definition: >-
      Sum of the longest diameters of target lesions, assessed on imaging under RECIST
      criteria, together with the status of non-target lesions and new lesions.
    synonyms: ["sum of diameters", "target lesion measurement", "tumour size", "tumor burden"]
    attributes: { modality: imaging, unit_family: length, commonly_centrally_read: true }
    status: reviewed
  - term_id: disease_progression
    label: Disease progression
    definition: >-
      Radiological or clinical worsening meeting pre-specified criteria, most often
      RECIST progressive disease.
    synonyms: ["progressive disease", "progression", "PD"]
    attributes: { modality: imaging, unit_family: event }
    status: reviewed
  - term_id: objective_tumour_response
    label: Objective tumour response category
    definition: >-
      The assigned response category, typically complete response, partial response,
      stable disease, or progressive disease, under a named criteria set.
    synonyms: ["best overall response", "response category", "CR", "PR"]
    attributes: { modality: imaging, unit_family: category }
    status: reviewed
  - term_id: minimal_residual_disease
    label: Minimal residual disease
    definition: >-
      Presence of residual malignant cells below the threshold of conventional detection,
      assessed by flow cytometry or sequencing at a stated sensitivity.
    synonyms: ["MRD", "measurable residual disease"]
    attributes: { modality: laboratory, unit_family: category, requires_assay_sensitivity: true }
    status: reviewed

  # ---- respiratory ---------------------------------------------------------
  - term_id: fev1
    label: Forced expiratory volume in one second
    definition: >-
      The volume of air forcibly exhaled in the first second of a maximal expiratory
      manoeuvre, measured by spirometry.
    synonyms: ["FEV1", "FEV-1", "forced expiratory volume"]
    attributes: { modality: physiological_measurement, unit_family: volume, requires_calibrated_equipment: true }
    status: reviewed
  - term_id: fvc
    label: Forced vital capacity
    definition: The total volume of air forcibly exhaled after maximal inspiration.
    synonyms: ["FVC"]
    attributes: { modality: physiological_measurement, unit_family: volume }
    status: reviewed
  - term_id: respiratory_exacerbation
    label: Respiratory exacerbation
    definition: >-
      An acute worsening of respiratory symptoms meeting protocol-defined severity
      criteria, usually keyed to the treatment required.
    synonyms: ["exacerbation", "COPD exacerbation", "asthma exacerbation", "pulmonary exacerbation"]
    attributes: { modality: clinician_reported, unit_family: event, requires_severity_definition: true }
    status: reviewed

  # ---- metabolic -----------------------------------------------------------
  - term_id: hba1c
    label: Glycated haemoglobin
    definition: >-
      The fraction of haemoglobin that is glycated, reflecting average glycaemia over
      approximately the preceding three months.
    synonyms: ["HbA1c", "haemoglobin A1c", "hemoglobin A1c", "A1C", "glycosylated hemoglobin"]
    attributes: { modality: laboratory, unit_family: mass_fraction }
    status: reviewed
  - term_id: body_weight
    label: Body weight
    definition: Measured body mass.
    synonyms: ["weight", "body mass"]
    attributes: { modality: physiological_measurement, unit_family: mass }
    status: reviewed
  - term_id: glucose_interstitial_continuous
    label: Interstitial glucose (continuous monitoring)
    definition: >-
      Glucose concentration sampled frequently by a continuous glucose monitor, supporting
      time-in-range endpoints.
    synonyms: ["CGM", "continuous glucose monitoring", "sensor glucose"]
    attributes: { modality: device_or_sensor, unit_family: substance_concentration, high_sampling_frequency: true }
    status: reviewed
  - term_id: ldl_cholesterol
    label: LDL cholesterol
    definition: Low-density lipoprotein cholesterol concentration.
    synonyms: ["LDL-C", "LDL", "low density lipoprotein"]
    attributes: { modality: laboratory, unit_family: mass_concentration }
    status: reviewed

  # ---- rheumatology / dermatology -----------------------------------------
  - term_id: acr_core_component_set
    label: ACR core component set
    definition: >-
      The seven-component set underlying ACR response: tender joint count, swollen joint
      count, patient and physician global assessments, patient pain, physical function,
      and an acute phase reactant.
    synonyms: ["ACR core set", "joint counts", "tender and swollen joint count"]
    attributes: { modality: clinician_reported, unit_family: composite, requires_component_rules: true }
    status: reviewed
  - term_id: das28
    label: Disease Activity Score 28
    definition: >-
      A weighted composite of 28 tender and swollen joint counts, an acute phase
      reactant, and a patient global assessment.
    synonyms: ["DAS28", "DAS28-CRP", "DAS28-ESR"]
    attributes: { modality: clinician_reported, unit_family: score }
    status: reviewed
  - term_id: psoriasis_area_severity_index
    label: Psoriasis Area and Severity Index
    definition: >-
      A clinician-scored composite of the area and severity of psoriatic lesions across
      body regions.
    synonyms: ["PASI"]
    attributes: { modality: clinician_reported, unit_family: score }
    status: reviewed
  - term_id: eczema_area_severity_index
    label: Eczema Area and Severity Index
    definition: A clinician-scored composite of the extent and severity of eczematous lesions.
    synonyms: ["EASI"]
    attributes: { modality: clinician_reported, unit_family: score }
    status: reviewed

  # ---- cardiovascular / renal ---------------------------------------------
  - term_id: major_adverse_cardiovascular_event
    label: Major adverse cardiovascular event
    definition: >-
      An adjudicated composite event, most commonly cardiovascular death, non-fatal
      myocardial infarction, or non-fatal stroke. The exact components vary by protocol
      and must be recorded per study.
    synonyms: ["MACE", "major adverse cardiac event", "cardiovascular composite"]
    attributes: { modality: event_adjudication, unit_family: event, requires_component_definition: true }
    status: reviewed
  - term_id: blood_pressure_systolic
    label: Systolic blood pressure
    definition: Peak arterial pressure during ventricular systole.
    synonyms: ["SBP", "systolic BP"]
    attributes: { modality: physiological_measurement, unit_family: pressure }
    status: reviewed
  - term_id: egfr
    label: Estimated glomerular filtration rate
    definition: >-
      Renal filtration rate estimated from serum creatinine or cystatin C using a named
      estimating equation.
    synonyms: ["eGFR", "glomerular filtration rate", "GFR"]
    attributes: { modality: laboratory, unit_family: normalised_flow, requires_reference_equation: true }
    status: reviewed
  - term_id: albuminuria
    label: Urinary albumin-to-creatinine ratio
    definition: Urinary albumin normalised to urinary creatinine.
    synonyms: ["UACR", "albumin creatinine ratio", "proteinuria"]
    attributes: { modality: laboratory, unit_family: mass_ratio }
    status: reviewed

  # ---- neurology / psychiatry ---------------------------------------------
  - term_id: disability_edss
    label: Expanded Disability Status Scale
    definition: A clinician-rated ordinal scale of neurological disability in multiple sclerosis.
    synonyms: ["EDSS", "disability progression"]
    attributes: { modality: clinician_reported, unit_family: score, ordinal: true }
    status: reviewed
  - term_id: relapse_ms
    label: Multiple sclerosis relapse
    definition: A protocol-defined episode of new or worsening neurological symptoms.
    synonyms: ["relapse", "annualised relapse rate", "annualized relapse rate", "ARR"]
    attributes: { modality: clinician_reported, unit_family: event }
    status: reviewed
  - term_id: cognitive_function_adas_cog
    label: ADAS-Cog
    definition: A performance-based battery assessing cognitive function in dementia trials.
    synonyms: ["ADAS-Cog", "Alzheimer's Disease Assessment Scale"]
    attributes: { modality: performance_outcome, unit_family: score }
    status: reviewed
  - term_id: depression_severity_scale
    label: Depression severity rating
    definition: >-
      A clinician- or patient-rated severity score for depressive symptoms on a named
      instrument.
    synonyms: ["MADRS", "HAM-D", "HDRS", "PHQ-9", "depression score"]
    attributes: { modality: clinician_reported, unit_family: score, requires_instrument: true }
    status: reviewed
  - term_id: seizure_occurrence
    label: Seizure occurrence
    definition: Occurrence of a seizure of a specified type, usually captured by participant diary.
    synonyms: ["seizure frequency", "seizure count"]
    attributes: { modality: patient_reported, unit_family: event }
    status: reviewed

  # ---- infectious disease / vaccines --------------------------------------
  - term_id: viral_load
    label: Viral load
    definition: Concentration of viral nucleic acid in a biological sample.
    synonyms: ["HIV-1 RNA", "HBV DNA", "HCV RNA", "viral suppression"]
    attributes: { modality: laboratory, unit_family: log_concentration, requires_assay_limit: true }
    status: reviewed
  - term_id: antibody_titre
    label: Antibody titre
    definition: Concentration or titre of antigen-specific antibody, used for immunogenicity.
    synonyms: ["GMT", "geometric mean titre", "seroconversion", "neutralising antibody"]
    attributes: { modality: laboratory, unit_family: titre }
    status: reviewed
  - term_id: microbiological_cure
    label: Microbiological eradication
    definition: Absence of the causative organism at a test-of-cure assessment.
    synonyms: ["microbiological cure", "eradication", "culture conversion"]
    attributes: { modality: laboratory, unit_family: category }
    status: reviewed
  - term_id: clinical_cure
    label: Clinical cure
    definition: Resolution of signs and symptoms of infection without further therapy.
    synonyms: ["clinical response", "clinical resolution"]
    attributes: { modality: clinician_reported, unit_family: category }
    status: reviewed

  # ---- ophthalmology / other ----------------------------------------------
  - term_id: visual_acuity_bcva
    label: Best-corrected visual acuity
    definition: Visual acuity measured with optimal refractive correction, usually on an ETDRS chart.
    synonyms: ["BCVA", "visual acuity", "ETDRS letters"]
    attributes: { modality: performance_outcome, unit_family: letters }
    status: reviewed
  - term_id: exercise_capacity_6mwd
    label: Six-minute walk distance
    definition: Distance walked on a flat surface in six minutes under standardised conditions.
    synonyms: ["6MWD", "6-minute walk", "six minute walk test", "6MWT"]
    attributes: { modality: performance_outcome, unit_family: length }
    status: reviewed
  - term_id: pain_intensity
    label: Pain intensity
    definition: Self-reported pain severity on a numeric or visual analogue rating scale.
    synonyms: ["NRS", "VAS", "pain score", "pain severity"]
    attributes: { modality: patient_reported, unit_family: score }
    status: reviewed
  - term_id: pharmacokinetic_exposure
    label: Pharmacokinetic exposure
    definition: >-
      Systemic drug exposure characterised by parameters such as maximum concentration or
      area under the concentration-time curve.
    synonyms: ["Cmax", "AUC", "pharmacokinetics", "PK", "trough concentration"]
    attributes: { modality: laboratory, unit_family: concentration }
    status: reviewed
