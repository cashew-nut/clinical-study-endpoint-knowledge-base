rulepack_id: oncology
version: 1.0.0
description: >-
  Maps registry outcome-measure text onto oncology endpoint concepts. Patterns are
  written against the phrasing conventions of registry outcome titles, which are far
  more stereotyped than protocol prose. Where a surface form is genuinely ambiguous the
  rule declines to fire rather than guessing, and the outcome is reported as
  unclassified.
rules:
  - rule_id: os.explicit
    concept_id: OS
    priority: 220
    confidence: 0.95
    match:
      any_of:
        - '\boverall survival\b'
        - '\bOS\b(?!\s*=)'
        - '\btime (?:to|until) death\b'
      none_of:
        - '\bevent[- ]free\b'
        - '\bprogression[- ]free\b'
        - '\bdisease[- ]free\b'
        - '\brate\b'
        - '\bpercentage of (?:participants|patients|subjects)\b'
      fields: [measure]
    notes: >-
      The bare 'OS' abbreviation is guarded against 'OS =' to avoid matching
      oxidative-stress and ophthalmic left/right-eye notation.

  - rule_id: os.landmark_rate
    concept_id: OS
    priority: 120
    confidence: 0.55
    match:
      any_of:
        - '\boverall survival rate\b'
        - '\b\d+[- ]year survival rate\b'
      fields: [measure]
    asserts:
      endpoint_form: responder_binary
      scale_type: proportion
      summary_measure: risk_difference
    notes: >-
      A landmark survival rate is a proportion, not a time-to-event quantity. The rule
      overrides the concept's form so the structure recorded matches what was measured.

  - rule_id: pfs.explicit
    concept_id: PFS
    priority: 230
    confidence: 0.95
    match:
      any_of:
        - '\bprogression[- ]free survival\b'
        - '\bPFS\b'
      none_of:
        - '\brate\b'
        - '\bpercentage of (?:participants|patients|subjects)\b'
        - '\bproportion of (?:participants|patients|subjects)\b'
      fields: [measure]
    notes: >-
      Guarded against 'PFS rate at 12 months', which is a landmark proportion rather
      than a time-to-event endpoint and is deliberately left unclassified.

  - rule_id: pfs.landmark_rate
    concept_id: PFS
    priority: 120
    confidence: 0.55
    match:
      any_of:
        - '\bprogression[- ]free survival rate\b'
        - '\bPFS rate\b'
      fields: [measure]
    asserts:
      endpoint_form: responder_binary
      scale_type: proportion
      summary_measure: risk_difference
      timepoint_selection: single_timepoint
    notes: >-
      A landmark PFS rate is the proportion alive and progression-free at a fixed time,
      not a time-to-event quantity. Confidence is low because the two are routinely
      conflated in registry titles and the distinction deserves human review.

  - rule_id: ttp.explicit
    concept_id: TTP
    priority: 235
    confidence: 0.9
    match:
      any_of:
        - '\btime to (?:disease )?progression\b'
      none_of:
        - '\bprogression[- ]free\b'
      fields: [measure]

  - rule_id: orr.explicit
    concept_id: ORR
    priority: 230
    confidence: 0.95
    match:
      any_of:
        - '\bobjective response rate\b'
        - '\boverall response rate\b'
        - '\bORR\b'
        - '\bbest overall response rate\b'
        - '\bobjective (?:tumou?r )?response\b'
      none_of:
        - '\bduration of\b'
        - '\btime to\b'
      fields: [measure]

  - rule_id: orr.proportion_phrasing
    concept_id: ORR
    priority: 190
    confidence: 0.8
    therapeutic_area_hint: oncology
    match:
      all_of:
        - '(?:percentage|proportion|number) of (?:participants|patients|subjects)'
        - '(?:complete|partial) response'
      none_of:
        - '\bduration\b'
        - '\bpathological\b'
        - '\bpathologic\b'
      fields: [measure_and_description]
    notes: >-
      Registry titles frequently spell out 'Percentage of Participants With Complete
      Response or Partial Response' rather than naming ORR.

  - rule_id: cr_rate.explicit
    concept_id: CR_RATE
    priority: 240
    confidence: 0.9
    match:
      any_of:
        - '\bcomplete response rate\b'
        - '\bcomplete remission rate\b'
        - '\brate of complete (?:response|remission)\b'
      none_of:
        - '\bpathological\b'
        - '\bpathologic\b'
      fields: [measure]

  - rule_id: pcr.explicit
    concept_id: PCR_RATE
    priority: 250
    confidence: 0.92
    match:
      any_of:
        - '\bpatholog(?:ical|ic) complete response\b'
        - '\bpCR\b'
      fields: [measure]

  - rule_id: dor.explicit
    concept_id: DOR
    priority: 240
    confidence: 0.92
    match:
      any_of:
        - '\bduration of (?:objective )?response\b'
        - '\bDoR\b'
        - '\bDOR\b'
      fields: [measure]

  - rule_id: dfs.explicit
    concept_id: DFS
    priority: 235
    confidence: 0.92
    match:
      any_of:
        - '\bdisease[- ]free survival\b'
        - '\brelapse[- ]free survival\b'
        - '\brecurrence[- ]free survival\b'
        - '\bDFS\b'
        - '\bRFS\b'
      none_of:
        - '\brate\b'
      fields: [measure]

  - rule_id: efs.explicit
    concept_id: EFS
    priority: 235
    confidence: 0.9
    match:
      any_of:
        - '\bevent[- ]free survival\b'
        - '\bEFS\b'
      none_of:
        - '\brate\b'
      fields: [measure]

  - rule_id: mrd.explicit
    concept_id: MRD_NEGATIVITY_RATE
    priority: 240
    confidence: 0.9
    match:
      any_of:
        - '\b(?:minimal|measurable) residual disease negativity\b'
        - '\bMRD[- ]negativ\w*\b'
        - '\bMRD negativity rate\b'
      fields: [measure_and_description]
