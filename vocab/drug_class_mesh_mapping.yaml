# --- layer 3: name patterns -----------------------------------------------
# WHO International Nonproprietary Name stems. This layer is doing more work
# than it looks like: INN stems are a published, enforced naming convention, so
# "-gliflozin" is not a guess about a drug, it is the WHO stem that made the
# drug's name what it is. That makes this the layer most likely to class an
# agent NLM has not coded yet -- which is exactly the gap `agent_names` cannot
# close, since a new molecular entity is routinely uncoded for a year or more
# after registration.
#
# Ordered most specific first, because first hit wins: "-ciclib" must be tried
# before the generic "-ib" family, and "-tinib" before "-nib".
name_patterns:
  - drug_class: sglt2_inhibitor
    patterns: ['\w+gliflozin\b']
  - drug_class: glp1_receptor_agonist
    patterns: ['\w+glutide\b', '\w+enatide\b']
  - drug_class: dpp4_inhibitor
    patterns: ['\w+gliptin\b']
  - drug_class: sulfonylurea
    patterns: ['\bgli(m|b|p)\w+ide\b']
  - drug_class: insulin_therapy
    patterns: ['\binsulin\b']
  - drug_class: statin
    patterns: ['\w+statin\b']
  - drug_class: ace_inhibitor
    patterns: ['\w+pril\b', '\w+prilat\b']
  - drug_class: angiotensin_receptor_blocker
    patterns: ['\w+sartan\b']
  - drug_class: beta_blocker
    patterns: ['\w+olol\b']
  - drug_class: calcium_channel_blocker
    patterns: ['\w+dipine\b']
  - drug_class: anticoagulant
    patterns: ['\w+xaban\b', '\w+gatran\b', '\w+parin\b']
  - drug_class: proton_pump_inhibitor
    patterns: ['\w+prazole\b']
  - drug_class: cdk_inhibitor
    patterns: ['\w+ciclib\b']
  - drug_class: parp_inhibitor
    patterns: ['\w+parib\b']
  - drug_class: proteasome_inhibitor
    patterns: ['\w+zomib\b']
  - drug_class: s1p_modulator
    patterns: ['\w+(mod|imod)\b']
  - drug_class: jak_inhibitor
    patterns: ['\w+citinib\b', '\w+tinib\b(?=.*\bjak\b)']
  - drug_class: cgrp_inhibitor
    patterns: ['\w+gepant\b']
  - drug_class: antiepileptic
    patterns: ['\w+racetam\b']
  - drug_class: antifungal
    patterns: ['\w+conazole\b', '\w+fungin\b']
  - drug_class: antiretroviral
    patterns: ['\w+gravir\b', '\w+navir\b']
  - drug_class: antibacterial
    patterns: ['\bcef\w+\b', '\w+cillin\b', '\w+floxacin\b', '\w+mycin\b', '\w+penem\b']
  - drug_class: tyrosine_kinase_inhibitor
    patterns: ['\w+tinib\b']
    notes: >-
      Deliberately last of the "-ib" family, and deliberately the parent class
      rather than a specific target: the stem says kinase inhibitor and nothing
      more. A specific target needs an `agent_names` entry.
  - drug_class: monoclonal_antibody
    patterns: ['\w+mab\b']
    notes: >-
      A `modality` class, so it never competes with a mechanism match -- an
      agent matched to pd1_inhibitor by name still picks this up as its modality
      (see `resolution.modality_is_orthogonal`).
  - drug_class: antibody_drug_conjugate
    patterns: ['\w+mab (vedotin|deruxtecan|govitecan|emtansine|mafodotin|tesirine)\b']
  - drug_class: fusion_protein
    patterns: ['\w+cept\b']
  - drug_class: oligonucleotide_therapy
    patterns: ['\w+(sen|siran|rsen)\b']
  # Vaccine platform, which no INN stem covers -- these are trial-name words.
  - drug_class: mrna_vaccine
    patterns: ['\bmrna\b.*\bvaccine\b', '\bvaccine\b.*\bmrna\b', '\bmodified mrna\b']
  - drug_class: viral_vector_vaccine
    patterns: ['\b(adenovir(us|al)|chadox|ad26|vector)\b.*\bvaccine\b', '\bviral vector\b']
  - drug_class: conjugate_vaccine
    patterns: ['\bconjugate vaccine\b', '\bpolysaccharide vaccine\b', '\bpcv\d+\b']
  - drug_class: whole_pathogen_vaccine
    patterns: ['\b(inactivated|live[- ]attenuated|killed)\b.*\bvaccine\b']
  - drug_class: subunit_vaccine
    patterns: ['\b(recombinant|subunit|adjuvanted|protein)\b.*\bvaccine\b']
  - drug_class: cell_therapy
    patterns: ['\w+(cel|leucel)\b', '\bcar-?t\b', '\bstem cell\b']
  - drug_class: gene_therapy
    patterns: ['\w+(gene|vec)\b', '\bgene therapy\b', '\baav\d*\b']

# --- layer 4: MeSH ancestors ----------------------------------------------
# NLM's own hierarchy, from derivedSection.interventionBrowseModule.ancestors[].
# CT.gov backend only -- AACT publishes no intervention ancestry (see
# ingest/aact_interventions.py), so this layer is simply empty there and the
# resolver falls through to branches and modality.
#
# Keyed on the ancestor descriptor, normalised. Where MeSH names a
# pharmacologic action precisely enough to be a mechanism ("Sodium-Glucose
# Transporter 2 Inhibitors"), this yields a mechanism class; where it names only
# a therapeutic category ("Antineoplastic Agents"), it yields a pharmacologic
# one. It never promotes the second into the first.
ancestor_rules:
  "Immune Checkpoint Inhibitors": checkpoint_inhibitor
  "Sodium-Glucose Transporter 2 Inhibitors": sglt2_inhibitor
  "Glucagon-Like Peptide-1 Receptor Agonists": glp1_receptor_agonist
  "Dipeptidyl-Peptidase IV Inhibitors": dpp4_inhibitor
  "Sulfonylurea Compounds": sulfonylurea
  "Insulins": insulin_therapy
  "Hydroxymethylglutaryl-CoA Reductase Inhibitors": statin
  "Angiotensin-Converting Enzyme Inhibitors": ace_inhibitor
  "Angiotensin Receptor Antagonists": angiotensin_receptor_blocker
  "Angiotensin II Type 1 Receptor Blockers": angiotensin_receptor_blocker
  "Adrenergic beta-Antagonists": beta_blocker
  "Adrenergic beta-2 Receptor Agonists": beta2_agonist
  "Calcium Channel Blockers": calcium_channel_blocker
  "Diuretics": diuretic
  "Mineralocorticoid Receptor Antagonists": mineralocorticoid_antagonist
  "Anticoagulants": anticoagulant
  "Platelet Aggregation Inhibitors": antiplatelet
  "Janus Kinase Inhibitors": jak_inhibitor
  "Tumor Necrosis Factor-alpha Inhibitors": tnf_inhibitor
  "Muscarinic Antagonists": muscarinic_antagonist
  "Leukotriene Antagonists": leukotriene_modifier
  "Proton Pump Inhibitors": proton_pump_inhibitor
  "Aromatase Inhibitors": aromatase_inhibitor
  "Androgen Antagonists": antiandrogen
  "Proteasome Inhibitors": proteasome_inhibitor
  "Poly(ADP-ribose) Polymerase Inhibitors": parp_inhibitor
  "Cholinesterase Inhibitors": cholinesterase_inhibitor
  "Serotonin Uptake Inhibitors": ssri_snri
  "Antipsychotic Agents": antipsychotic
  "Anticonvulsants": antiepileptic
  "Analgesics, Opioid": opioid_analgesic
  "Anti-Inflammatory Agents, Non-Steroidal": nsaid
  "Adrenal Cortex Hormones": corticosteroid
  "Glucocorticoids": corticosteroid
  "Calcineurin Inhibitors": calcineurin_inhibitor
  "Bone Density Conservation Agents": bone_resorption_inhibitor
  "Antitubercular Agents": antimycobacterial
  "Antimalarials": antiparasitic
  "Protein Kinase Inhibitors": tyrosine_kinase_inhibitor
  "Antibodies, Monoclonal": monoclonal_antibody
  # Therapeutic categories, not mechanisms.
  "Antineoplastic Agents": antineoplastic_agent
  "Antineoplastic Agents, Immunological": antineoplastic_agent
  "Anti-Bacterial Agents": antibacterial
  "Antiviral Agents": antiviral
  "Anti-Retroviral Agents": antiretroviral
  "Antifungal Agents": antifungal
  "Anti-Infective Agents": anti_infective_agent
  "Hypoglycemic Agents": antidiabetic_agent
  "Antihypertensive Agents": cardiovascular_agent
  "Cardiovascular Agents": cardiovascular_agent
  "Immunosuppressive Agents": immunomodulating_agent
  "Antirheumatic Agents": immunomodulating_agent
  "Immunologic Factors": immunomodulating_agent
  "Bronchodilator Agents": respiratory_agent
  "Gastrointestinal Agents": gastrointestinal_agent
  "Central Nervous System Agents": cns_agent
  "Analgesics": analgesic_agent
  "Dermatologic Agents": dermatologic_agent
  "Hormones": hormonal_agent
  "Micronutrients": nutritional_agent
  "Vitamins": nutritional_agent

# --- layer 5: coarse browse branches --------------------------------------
# derivedSection.interventionBrowseModule.browseBranches[]. CT.gov backend only.
#
# Matched on `branch_name`, NEVER by parsing `branch_abbrev`: the CONDITION
# branch abbreviations turned out to be "B" + a MeSH tree code ("BC04" =
# Neoplasms, see ta/resolver.py), and there is no evidence the intervention
# branches use that convention -- they are not documented anywhere this project
# can reach. Landing them verbatim and matching the name costs nothing and
# cannot be silently wrong the way a parsed abbreviation could.
#
# Always yields a `pharmacologic` class. This is the weakest layer above the
# defaults, and it exists so a study whose interventions resolve to no mechanism
# lands somewhere honest rather than in `unclassified_agent`.
branch_rules:
  - drug_class: antineoplastic_agent
    patterns: ['\bantineoplastic\b']
  - drug_class: anti_infective_agent
    patterns: ['\banti-?infective\b', '\bantimicrobial\b']
  - drug_class: cardiovascular_agent
    patterns: ['\bcardiovascular\b', '\bantihypertensive\b']
  - drug_class: cns_agent
    patterns: ['\bcentral nervous system\b', '\bpsychotropic\b', '\bneuro']
  - drug_class: gastrointestinal_agent
    patterns: ['\bgastrointestinal\b']
  - drug_class: respiratory_agent
    patterns: ['\brespiratory system\b']
  - drug_class: dermatologic_agent
    patterns: ['\bdermatolog']
  - drug_class: hormonal_agent
    patterns: ['\bhormone', '\bhormonal\b']
  - drug_class: immunomodulating_agent
    patterns: ['\bimmunolog', '\bimmunosuppress', '\banti-?inflammatory\b']
  - drug_class: analgesic_agent
    patterns: ['\banalgesic']
  - drug_class: haematologic_agent
    patterns: ['\b(h)?a?ematolog']
  - drug_class: nutritional_agent
    patterns: ['\bmicronutrient', '\bvitamin']
  - drug_class: ophthalmic_agent
    patterns: ['\bophthalmic\b']
    notes: >-
      "All Drugs and Chemicals" is deliberately unmapped. It is on essentially
      every drug study, so mapping it would give every such study one identical
      class and make the axis look far better covered than it is.

# --- layer 6: modality, from the registry's own intervention_type ---------
# The one layer that is a fallback within its axis rather than a competitor:
# it fires only where no `modality` class has already been matched for that
# intervention, so a "-mab" that already resolved to monoclonal_antibody is not
# also called a small molecule.
#
# Keyed on intervention_type, case- and separator-insensitively (the two
# backends spell these differently, the same way they spell PRIMARY/Primary
# differently -- see ingest/results.py).
modality_rules:
  DRUG: small_molecule
  DEVICE: device_intervention
  PROCEDURE: procedure_intervention
  RADIATION: procedure_intervention
  BEHAVIORAL: behavioural_intervention
  DIETARY_SUPPLEMENT: nutritional_agent
  GENETIC: gene_therapy
  DIAGNOSTIC_TEST: device_intervention
  COMBINATION_PRODUCT: device_intervention
  notes: >-
    BIOLOGICAL is deliberately absent. It covers monoclonal antibodies,
    vaccines, cell therapies and recombinant proteins alike, so any single
    modality it mapped to would be wrong most of the time; the name stems in
    layer 3 classify biologics far better than the type field can. An
    unmatched BIOLOGICAL simply carries no modality class, which is the honest
    outcome.

# --- layer 7: defaults ----------------------------------------------------
defaults:
  no_rule_matched: unclassified_agent
  no_interventions_on_study: no_interventions_stated

resolution:
  keep_all_matches: true
  modality_is_orthogonal: true
  notes: >-
    `modality_is_orthogonal` is what stops layers 0-5 and layer 6 competing: an
    intervention may hold at most one class of each `kind`, decided
    first-hit-wins within that kind, and the kinds do not suppress each other.
    So pembrolizumab in a trial is pd1_inhibitor (mechanism) AND
    monoclonal_antibody (modality), and neither is a defeat for the other. The
    per-study primary is then the lowest `precedence` across all of them, which
    the precedence bands in drug_classes.yaml arrange to be the mechanism.

caveats:
  - >-
    NOT ONE RULE IN THIS FILE HAS BEEN RUN AGAINST A LIVE PULL. This sandbox
    cannot reach clinicaltrials.gov or AACT (confirmed: HTTP 403 on the outbound
    proxy), which is the same constraint vocab/ta_mesh_mapping.yaml's caveats
    record. Everything here is written from the documented API v2 shape and from
    published MeSH/INN naming conventions. docs/DRUG_CLASS_SPEC.md's "Phasing,
    with a gate" lists the four counts a first live pull owes this file; the two
    that would change it most are whether `interventionBrowseModule.ancestors[]`
    exists at all (layer 4 is empty without it) and what the intervention
    `browseBranches[]` names actually look like (layer 5 is matched on them).
  - >-
    `agent_names` is a snapshot, and drug dictionaries perish. Agents approved
    after this file was written will fall through to `name_patterns`, which is
    why that layer is built on WHO INN stems rather than on ad-hoc regexes: a
    2027 SGLT2 inhibitor will still be called something-gliflozin. Agents whose
    class has no stem, and which NLM has not yet coded, will land in
    conformed.drug_class_review_queue. That is the intended failure mode.
  - >-
    "Aspirin" is classed as `antiplatelet`, not `nsaid`. Both are true; the
    judgment is that a trial registering aspirin as an intervention is far more
    often studying its antiplatelet effect than its analgesic one. This is
    exactly the kind of call `term_overrides` exists to make visible rather than
    bury, and it is a single-line change if a live corpus says otherwise.
  - >-
    The `-mod`/`-imod` stem used for S1P modulators is the loosest pattern in
    layer 3 and will over-match (any drug name ending in those letters). It is
    kept because the S1P class is otherwise poorly covered by ancestors, and
    because `agent_names` catches the five agents that matter first. Worth
    checking against the first real review queue.
  - >-
    Layer 3's `\w+cept\b` (fusion proteins) and `\w+mab\b` (antibodies) both
    yield MODALITY classes, so an over-match there costs a wrong modality, never
    a wrong mechanism. That asymmetry is deliberate: the loosest patterns are
    confined to the axis where being wrong is cheapest.
