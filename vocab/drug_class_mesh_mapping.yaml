# Intervention -> drug class.
#
# Drug class is not a field on either ingestion backend, so it has to be derived
# from what each study registered as its interventions. Both backends expose
# that, but not identically:
#
#   AACT      ctgov.interventions (intervention_type, name, description),
#             ctgov.intervention_other_names, and ctgov.design_group_interventions
#             -- a real arm<->intervention join table. No MeSH ancestors, and no
#             intervention browse branches.
#   CT.gov v2 protocolSection.armsInterventionsModule.interventions[] (type,
#             name, otherNames[], armGroupLabels[]) plus
#             derivedSection.interventionBrowseModule's meshes[], ancestors[]
#             and browseBranches[] -- the ancestry AACT lacks, but only an
#             arm-label string match where AACT has a join table.
#
# So the mapping is written in layers, applied in this order, FIRST HIT WINS PER
# INTERVENTION, with one exception noted at layer 6:
#
#   0. control_rules   placebo/sham/standard-of-care first, so a control arm is
#                      never classed by a MeSH term the sponsor attached to the
#                      study as a whole.
#   1. term_overrides  exact drug name, matched against BOTH the NLM descriptor
#                      and the sponsor's own `name`/`other_name`. Where a name's
#                      obvious class is the wrong one, this settles it by hand.
#                      Matched against both because for interventions the
#                      descriptor IS a drug name and sponsors usually write the
#                      same string -- an override that applied only to the NLM
#                      side would settle half the corpus at random.
#   2. agent_names     exact drug name. Matched against BOTH the sponsor's
#                      `name`/`other_name` AND the NLM descriptor, because for
#                      interventions the descriptor IS a drug name. A curated
#                      entry is a human assertion about a specific drug, which
#                      is why it outranks NLM's own ancestry below.
#   3. name_patterns   WHO INN stems, and the vaccine-platform words no stem
#                      covers. See the block's own note -- this layer is doing
#                      more work than it looks like.
#   4. ancestor_rules  MeSH ancestors of the coded interventions. NLM's own
#                      hierarchy: the mechanism signal, where it exists.
#   5. branch_rules    CT.gov's coarse pharmacologic branches. Always yields a
#                      `pharmacologic` class, never a mechanism claim.
#   6. modality_rules  the registry's own intervention_type. Applies only where
#                      no `modality` class has already been matched for that
#                      intervention -- unlike every other layer, this one is a
#                      fallback WITHIN its axis rather than a first-hit-wins
#                      competitor, because "monoclonal antibody" and "small
#                      molecule" are alternatives and "PD-1 inhibitor" and
#                      "monoclonal antibody" are not.
#   7. defaults        unclassified_agent / no_interventions_stated.
#
# A study usually has several interventions and therefore several classes. Keep
# them all; drug_classes.yaml `precedence` picks the primary. Do NOT collapse to
# one class here -- combination therapy is the norm, and a trial of
# pembrolizumab plus carboplatin genuinely is both.
#
# WHAT THIS FILE IS NOT. It is not a drug dictionary, and must not grow into
# one under coverage pressure. `agent_names` covers the agents a Phase 3 corpus
# is mostly made of; everything else is meant to be caught by the stem, ancestor
# and branch layers, and what those miss goes to
# conformed.drug_class_review_queue rather than being guessed at. If the review
# queue is dominated by one class's agents, the fix is a review round, not a
# looser pattern.

version: 1
dimension: drug_class_mesh_mapping
applies_to: [interventions, intervention_other_names, browse_interventions,
             browse_intervention_ancestors, browse_intervention_branches]

# --- layer 0: controls ----------------------------------------------------
# Matched against the intervention NAME, before anything else. A placebo arm in
# a pembrolizumab trial carries the study's MeSH codes like every other arm, so
# any layer that ran first would class the placebo as a PD-1 inhibitor.
control_rules:
  - drug_class: placebo
    name_patterns:
      - '^placebo'
      - '\bplacebo\b'
      - '\bmatching placebo\b'
      - '\bvehicle (control|only)\b'
  - drug_class: sham
    name_patterns:
      - '\bsham\b'
  - drug_class: standard_of_care
    name_patterns:
      - '\bstandard of care\b'
      - '\bstandard care\b'
      - '\busual care\b'
      - "\\bphysician'?s choice\\b"
      - '\binvestigator.s choice\b'
      - '\bbest supportive care\b'
      - '\btreatment as usual\b'
      - '\bcontrol (arm|group|regimen)\b'
  - drug_class: no_intervention
    name_patterns:
      - '^no (intervention|treatment)\b'
      - '\bobservation only\b'
      - '\bwatchful waiting\b'
    notes: >-
      Distinct from placebo, and the distinction matters: an arm that receives
      nothing has no blinding and no placebo response, so its variability is not
      the placebo arm's variability.

# --- layer 1: exact MeSH descriptor overrides -----------------------------
# Only for descriptors whose obvious class is the wrong one. Everything else
# should be an `agent_names` entry, which is matched against the descriptor too.
term_overrides:
  # Matched against the NLM descriptor and the sponsor's intervention name
  # alike, so the keys are written in descriptor case and normalised on both
  # sides before comparison.
  # An antimalarial by INN stem and MeSH ancestry, but in trial registrations it
  # is overwhelmingly an antirheumatic or (2020-2021) a COVID antiviral
  # candidate. Left as antiparasitic deliberately -- the mechanism is what it is,
  # and the therapeutic area separates the uses.
  "Hydroxychloroquine": antiparasitic
  # Both an NSAID and an antiplatelet. Classed as antiplatelet because that is
  # what a trial registering it as an intervention is almost always studying;
  # see `caveats`.
  "Aspirin": antiplatelet
  # MeSH files these under their chemistry; the class that matters is the action.
  "Metformin": biguanide
  "Dexamethasone": corticosteroid
  "Prednisone": corticosteroid
  "Methotrexate": antimetabolite_chemotherapy
  # A VEGF inhibitor in oncology and in ophthalmology alike. Kept as one class:
  # the mechanism does not change with the eye.
  "Bevacizumab": vegf_inhibitor
  "Aflibercept": vegf_inhibitor
  # An EGFR/MET bispecific: both claims are true, and both are kept.
  "Amivantamab": [egfr_inhibitor, bispecific_engager]

