      device studies land here legitimately.

# How a study with several matching classes is resolved.
resolution:
  keep_all_matches: true              # study_drug_class is many-to-many
  primary_by: precedence              # lowest `precedence` wins the primary class
  tie_break: intervention_frequency   # then the class backed by most interventions
  notes: >-
    Combination therapy is the norm, not an edge case -- a trial of
    pembrolizumab plus chemotherapy is a checkpoint-inhibitor trial AND a
    platinum-chemotherapy trial, and collapsing it to one would be the same
    mistake therapeutic_areas.yaml refuses for a lung-cancer trial. Every
    matched class is kept; precedence only picks which one a single-column
    `GROUP BY` gets. A query that wants the combination has the full set
    alongside it.
