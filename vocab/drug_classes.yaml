# Dimension: DRUG CLASS.
#
# Not a native field on either ingestion backend -- like therapeutic area, it is
# derived from what the study registered as its interventions (see
# drug_class_mesh_mapping.yaml). This file is only the closed list of classes
# plus the rules for resolving a study that maps to several.
#
# WHAT A "CLASS" MEANS HERE, and it is the decision the whole axis rests on:
# MeSH classifies a substance twice, structurally (metformin is a *biguanide*)
# and functionally (metformin is a *hypoglycemic agent*). For grouping
# ENDPOINTS, mechanism is the axis that carries signal -- two drugs that lower
# HbA1c through the same receptor should behave alike on an HbA1c endpoint; two
# drugs that share a ring system should not. So every term declares a `kind`:
#
#   mechanism     the target or pathway acted on -- GLP-1 receptor agonist,
#                 PD-1 inhibitor, SGLT2 inhibitor. The useful axis.
#   pharmacologic the coarse action level, which is what CT.gov's intervention
#                 browse branches give directly -- antineoplastic agent,
#                 cardiovascular agent. A weaker claim, never a mechanism one.
#   modality      what kind of thing it is -- small molecule, monoclonal
#                 antibody, cell therapy, device, behavioural intervention.
#                 Orthogonal to the other two; a study is normally both.
#   control       placebo, sham, standard of care, no intervention.
#
# `kind` is MANDATORY so that a query has to say which axis it means, the same
# way docs/COMPOSITE_ENDPOINTS_SPEC.md makes composite `kind` mandatory. A
# GROUP BY that mixes them silently compares "PD-1 inhibitor" against
# "monoclonal antibody" as if they were alternatives.
#
# STRUCTURAL CLASS IS NOT MODELLED. Not modelled badly -- absent. If a use for
# it appears it is a fourth `kind`, not a redefinition of these.
#
# `control` is a first-class kind rather than bookkeeping: half the arms in a
# placebo-controlled corpus are placebo arms, and an axis that cannot name them
# cannot exclude them, which makes the first honest question anyone asks --
# what does this class do relative to placebo? -- unanswerable.
#
# PRECEDENCE BANDS. Lower wins the primary class. The bands encode "the most
# specific claim about what is being tested wins":
#
#     10-199   mechanism    a named target beats everything, and within a
#                           family a CHILD outranks its PARENT -- `pd1_inhibitor`
#                           beats `checkpoint_inhibitor`, because the specific
#                           claim is the one worth grouping by. The loader
#                           enforces this (`_validate_drug_classes`).
#    200-299   pharmacologic
#    300-399   modality     how it is made is the weakest useful claim
#    400-499   control      a placebo-controlled trial of drug X is a trial
#                           of drug X
#    900+      defaults     only when nothing else matched
#
# `parent` is one shallow level of rollup (pd1_inhibitor -> checkpoint_inhibitor),
# validated acyclic. It is NOT the recursive structure
# docs/COMPOSITE_ENDPOINTS_SPEC.md argues for, and should not grow into one.
#
# COVERAGE IS DELIBERATELY PARTIAL. This is the first round, scoped to the
# classes a Phase 3 corpus is mostly made of across the therapeutic areas
# therapeutic_areas.yaml already covers. It is not a pharmacopoeia and must not
# become one by coverage pressure: an intervention that matches nothing goes to
# conformed.drug_class_review_queue and stays `unclassified_agent` until a human
# review round adds the term. See vocab/README.md, "Adding or changing a term".

version: 1
dimension: drug_class
terms:

  # --- mechanism: oncology ------------------------------------------------
  # The densest block, because oncology dominates Phase 3 registration volume
  # and because combination therapy is the norm there -- which is exactly why
  # `resolution.keep_all_matches` matters more here than anywhere else.

