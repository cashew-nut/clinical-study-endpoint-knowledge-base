# Dimension: EVENT -- what occurrence ends the clock, for a time-to-event (or
# other event-family) endpoint. Added by docs/EVENT_SEMANTICS_SPEC.md.
#
# THE GAP THIS FILLS. A time-to-event endpoint is defined by a time origin and
# an event; before this file the model had dimensions for the origin
# (`reference`) and for what is assessed (`measurement`), and none for the
# event itself. Projecting "PFS" therefore rendered the only thing it had --
# the assessment -- into the event slot of the sentence ("Time from
# randomisation to Tumour burden (RECIST)"), which is confident and wrong: PFS
# is time to *progression or death*, not time to *an assessment*. See
# docs/EVENT_SEMANTICS_SPEC.md for the full defect and the NCT01777919 case
# that surfaced it.
#
# GRAIN. Same common schema as every other dimension file (version, dimension,
# terms, snake_case ids, whole-token synonyms, case-insensitive patterns unless
# scoped per matching.yaml) plus two fields new to this file and one borrowed:
#
#   polarity        harm | benefit. Replaces the event_polarity_cues lookup
#                    for any row whose event resolves -- directions.yaml's cue
#                    regexes stay as the fallback for rows whose event does
#                    NOT resolve, so the two cannot drift apart (see that
#                    file's note).
#   ascertained_by   measurement id(s) that typically ascertain this event.
#                    Documentation and a validation target (ids must exist),
#                    not a matching input -- it is what keeps the PFS<->ORR
#                    join explicable: the PFS event's progression component is
#                    ascertained by the same RECIST measurement ORR is a
#                    responder proportion over.
#   components       makes an EVENT UNION explicit: event ids only, acyclic,
#                    same discipline as composites.yaml (curated, cited, never
#                    inferred from text). A term carries `components` OR
#                    `ascertained_by`+match rules, never both -- a union is
#                    reached via a named-endpoint definition (or its own
#                    synonyms, if it is later given any), never assembled at
#                    match time from its parts.
#
# WHY NOT REGRAIN MEASUREMENT INSTEAD. measurements.yaml keeps PFS and ORR on
# one id (`tumour_burden_recist`) on purpose -- that shared id is the
# SAME_MEASUREMENT_DIFFERENT_FORM join. Moving "progression-free survival"
# onto an event-grained measurement id would fix the PFS sentence by
# destroying that join. The event is a new axis, not a better measurement.
#
# CROSS-FILE SYNONYM DISCIPLINE. Endpoint-NAME synonyms (PFS, OS, DFS, TTP,
# DOR...) live in named_endpoints.yaml, not here: this file is for the EVENT
# itself, named by the clinical occurrence, not by the literature acronym for
# a whole endpoint bundle. Where a phrase already resolves a measurement whose
# `implies_event` names this term (e.g. "disease progression" resolving
# `disease_progression_event`, which implies `disease_progression`), this file
# deliberately does NOT duplicate that phrase as its own synonym -- the
# validator rejects a synonym claimed by two of {measurement, event,
# named_endpoint}, and duplicating it here would only race the measurement
# match for no gain. Synonyms/patterns below are therefore the event-specific
# residue: wording that names the OCCURRENCE ("time to X") rather than the
# assessment of it.
#
# COVERAGE. The starter set is every distinct event class named by
# directions.yaml's `event_polarity_cues` harm/benefit regexes, plus the
# event-shaped measurement terms (`vital_status`, `disease_recurrence`,
# `treatment_failure`, `disease_progression_event`). Growth follows the
# standing rule every other vocabulary file states: from a human review round
# against real misses, never to chase coverage.

version: 1
dimension: event
terms:

  # =========================================================================
  # ONCOLOGY / SURVIVAL
  # =========================================================================
  - id: death_any_cause
    label: "Death from any cause"
    inline_label: "death from any cause"
    concept: survival
    polarity: harm
    ascertained_by: [vital_status]
    synonyms: ["all-cause death", "death from any cause", "died"]
    patterns:
      - '\btime to (all[- ]cause )?death\b'
      - '\b(all[- ]cause|overall) mortality\b'
    notes: >-
      The OS event. No bare "death" synonym: `vital_status` already lists it
      as an assessment-language measurement synonym, and that measurement's
      `implies_event` reaches this term with no duplicated text match --
      keeping "death" here too would be the exact cross-file collision the
      validator's ambiguous-synonym rule exists to catch.

  - id: disease_progression
    label: "Objective disease progression"
    inline_label: "disease progression"
    concept: disease_progression
    polarity: harm
    ascertained_by: [tumour_burden_recist, disease_progression_event]
    synonyms: ["objective progression"]
    patterns:
      - '\btime to (disease |radiographic |objective )?progression\b'
    notes: >-
      Deliberately does not repeat "disease progression" / "radiographic
      progression" / "progressive disease" here: those already resolve
      `disease_progression_event` as a measurement (or `tumour_burden_recist`
      via RECIST wording), and that measurement's `implies_event` reaches this
      term with no duplicated text match. Only the residue -- "time to
      progression" phrasing and the one synonym neither measurement lists --
      lives here.

  - id: disease_progression_or_death
    label: "Disease progression or death from any cause"
    inline_label: "disease progression or death"
    concept: disease_progression
    polarity: harm
    components: [disease_progression, death_any_cause]
    notes: >-
      The PFS event. An event union: the endpoint fires on whichever
      component occurs first. Components follow the composite spec's
      event_union discipline -- curated, cited, never inferred from text.
      Reached via the `pfs`/`rpfs`/`dor` named-endpoint definitions, not by
      text matching (no synonyms/patterns of its own).

  - id: disease_recurrence
    label: "Disease recurrence or relapse"
    inline_label: "disease recurrence"
    concept: disease_recurrence
    polarity: harm
    ascertained_by: [disease_recurrence]
    notes: >-
      No synonyms of its own: "recurrence", "relapse" and their variants
      already resolve the `disease_recurrence` measurement, whose
      `implies_event` reaches this term. Kept as a plain event (not a union)
      distinct from `disease_recurrence_or_death`, which TTP-style DFS/RFS
      definitions use instead.

  - id: disease_recurrence_or_death
    label: "Disease recurrence or death from any cause"
    inline_label: "disease recurrence or death"
    concept: disease_recurrence
    polarity: harm
    components: [disease_recurrence, death_any_cause]
    notes: The DFS/RFS event. Reached via the `dfs` named-endpoint definition.

  - id: response_onset
    label: "Onset of objective response"
    inline_label: "objective response"
    concept: tumour_response
    polarity: benefit
    ascertained_by: [tumour_burden_recist]
    patterns:
      - '\btime to (first |confirmed |objective )?response\b'
    notes: >-
      The TTR event, and (as a REFERENCE, a separate vocab entry of the same
      id in references.yaml) DOR's time origin -- "duration of response"
      counts from the moment response is first documented, not from
      randomisation.

  - id: treatment_failure
    label: "Treatment failure / need for subsequent therapy"
    inline_label: "treatment failure"
    concept: treatment_failure
    polarity: harm
    ascertained_by: [treatment_failure]
    notes: >-
      No synonyms of its own: "treatment failure" bare stays an
      assessment-language measurement synonym, whose `implies_event` reaches
      this term. The FFS/TFST/TSST/TTNT literature names live in
      named_endpoints.yaml.

  # =========================================================================
  # CROSS-DISEASE CLINICAL EVENTS
  # =========================================================================
  - id: clinical_deterioration
    label: "Clinical deterioration or worsening"
    inline_label: "clinical deterioration"
    concept: global_clinical_change
    polarity: harm
    patterns:
      - '\btime to (clinical )?(deterioration|worsening)\b'
    notes: >-
      The disease-agnostic worsening event used outside oncology (IPF, CKD,
      heart failure, MS) where RECIST-style progression has no meaning.

  - id: disease_exacerbation
    label: "Disease exacerbation"
    inline_label: "exacerbation"
    concept: disease_exacerbation
    polarity: harm
    ascertained_by: [disease_exacerbation]
    patterns:
      - '\btime to (first |next )?exacerbation\b'
    notes: >-
      No "exacerbation" synonym of its own: the `disease_exacerbation`
      measurement already lists it (plus "flare"/"attack") and its
      `implies_event` reaches this term with no duplicated text match.

  - id: hospitalisation_event
    label: "Hospitalisation"
    inline_label: "hospitalisation"
    concept: hospitalisation
    polarity: harm
    patterns:
      - '\btime to (first |next )?hospitali[sz]ation\b'

  - id: rescue_medication_initiation
    label: "Initiation of rescue medication"
    inline_label: "initiation of rescue medication"
    concept: rescue_medication
    polarity: harm
    ascertained_by: [rescue_medication_use]
    patterns:
      - '\btime to (initiation of )?rescue (medication|therapy|treatment)\b'
    notes: >-
      Needing rescue medication is the bad outcome, so later is better --
      easy to get backwards, which is why directions.yaml wrote this one down
      rather than leaving it to a default.

  - id: treatment_discontinuation
    label: "Treatment discontinuation or withdrawal"
    inline_label: "treatment discontinuation"
    concept: treatment_discontinuation
    polarity: harm
    patterns:
      - '\btime to (treatment )?discontinuation\b'
      - '\btime to withdrawal\b'

  - id: amputation
    label: "Amputation"
    inline_label: "amputation"
    concept: amputation
    polarity: harm
    patterns:
      - '\btime to amputation\b'

  - id: dialysis_initiation
    label: "Initiation of dialysis"
    inline_label: "initiation of dialysis"
    concept: kidney_function
    polarity: harm
    patterns:
      - '\btime to (initiation of )?dialysis\b'

  - id: transplantation
    label: "Need for transplantation"
    inline_label: "transplantation"
    concept: transplantation
    polarity: harm
    patterns:
      - '\btime to transplant\w*\b'
    notes: >-
      The harm sense -- organ failure severe enough to require a transplant.
      Distinct from `references.yaml`'s `index_event`, which covers dating a
      trial's clock FROM a transplant already performed.

  - id: bleeding_event
    label: "Bleeding event"
    inline_label: "a bleeding event"
    concept: bleeding_event
    polarity: harm
    patterns:
      - '\btime to (first )?bleed(ing)?\b'

  - id: seizure_event
    label: "Seizure"
    inline_label: "a seizure"
    concept: seizure_burden
    polarity: harm
    patterns:
      - '\btime to (first )?seizure\b'

  - id: fracture_event
    label: "Fracture"
    inline_label: "a fracture"
    concept: fracture
    polarity: harm
    patterns:
      - '\btime to (first )?fracture\b'

  # =========================================================================
  # CARDIOVASCULAR AND RESPIRATORY EVENTS
  # =========================================================================
  # Added in round three, against a pull whose two largest areas are
  # cardiovascular and respiratory. Before it, event resolution on event-family
  # rows ran 72.0% in oncology and 48.8% / 47.7% in those two -- the same
  # oncology bias measurements.yaml had, in the dimension where being wrong is
  # loudest: an event-family row whose event does not resolve renders at
  # `partial` tier, and one that resolves to the WRONG event renders a
  # confident, standards-conformant, clinically wrong sentence. "Major adverse
  # cardiovascular events within 30 days (MACE30)" resolved to
  # `death_any_cause` before these terms existed.
  #
  # Every term here follows this file's cross-file synonym discipline: the
  # wording lives on the measurement (measurements.yaml's cardiovascular and
  # respiratory round-three blocks), which reaches the event through
  # `implies_event`; what stays here is the residue that names the OCCURRENCE
  # rather than the assessment of it -- "time to X" phrasings and composite
  # unions with no text form of their own.

  - id: myocardial_infarction
    label: "Myocardial infarction"
    inline_label: "myocardial infarction"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [myocardial_infarction]
    patterns:
      - '\btime to (first |recurrent )?(myocardial infarction|infarction)\b'

  - id: stroke
    label: "Stroke"
    inline_label: "a stroke"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [stroke]
    patterns:
      - '\btime to (first |recurrent )?strokes?\b'

  - id: cardiovascular_death
    label: "Cardiovascular death"
    inline_label: "cardiovascular death"
    concept: survival
    polarity: harm
    ascertained_by: [vital_status]
    synonyms: ["cardiovascular death", "CV death", "cardiac death", "death from cardiovascular causes",
               "cardiovascular mortality"]
    notes: >-
      The one cardiovascular event that does carry its own synonyms rather than
      arriving through a measurement's `implies_event`. It has to: the
      measurement that ascertains it is `vital_status`, whose `implies_event` is
      `death_any_cause`, and a trial's cardiovascular-death endpoint is a
      strictly narrower event than its all-cause one. Leaving it to
      `vital_status` would have rendered "Time from randomisation to death from
      any cause" over a CV-death endpoint -- the same class of confident, wrong
      sentence as the PFS defect that created this file. The measurement stays
      `vital_status` either way, so the survival join is untouched.

  - id: worsening_heart_failure
    label: "Worsening heart failure"
    inline_label: "worsening heart failure"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [worsening_heart_failure, heart_failure_hospitalisation]

  - id: revascularisation
    label: "Revascularisation"
    inline_label: "revascularisation"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [coronary_revascularisation]
    patterns:
      - '\btime to (first |unplanned |urgent |repeat )?revascular\w*\b'

  - id: stent_thrombosis
    label: "Stent thrombosis"
    inline_label: "stent thrombosis"
    concept: thrombotic_event
    polarity: harm
    ascertained_by: [stent_thrombosis]

  - id: venous_thromboembolism
    label: "Venous thromboembolism"
    inline_label: "venous thromboembolism"
    concept: thrombotic_event
    polarity: harm
    ascertained_by: [venous_thromboembolism]

  - id: atrial_fibrillation
    label: "Atrial fibrillation or flutter"
    inline_label: "atrial fibrillation"
    concept: cardiac_arrhythmia
    polarity: harm
    ascertained_by: [atrial_fibrillation]
    patterns:
      - '\btime to (first |recurrent )?(atrial fibrillation|atrial flutter)\b'

  - id: cardiac_arrest
    label: "Cardiac arrest"
    inline_label: "cardiac arrest"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [cardiac_arrest]

  - id: unstable_angina
    label: "Unstable angina"
    inline_label: "unstable angina"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [unstable_angina]

  - id: major_adverse_cardiovascular_event
    label: "Major adverse cardiovascular event (MACE)"
    inline_label: "a major adverse cardiovascular event"
    concept: cardiovascular_event
    polarity: harm
    ascertained_by: [major_adverse_cardiovascular_event]
    patterns:
      - '(?-i:\bMACC?E\b)'
      - '(?-i:\bNACE\b)'
      - '\bmajor adverse (cardiovascular|cardiac)( and cerebrovascular)? events?\b'
      - '\bnet adverse (clinical|event clinical) events?\b'
    notes: >-
      MACE is clinically a union of cardiovascular death, myocardial infarction
      and stroke -- all three of which are event ids in this section -- and it
      is deliberately NOT declared with `components`. This file's XOR rule
      (`components` XOR match rules) draws exactly the right line, and MACE is
      on the other side of it from `disease_progression_or_death`: that term has
      no text form of its own and is reached only through the `pfs` definition,
      whereas MACE is a name sponsors write down, so it has to match text. The
      component list is recorded here in prose instead of in a field the
      matcher would then have to be forbidden from using. The four- and
      five-point variants (adding revascularisation, hospitalisation for
      unstable angina) are the same event with a different adjudication
      definition, which is a Threshold question rather than a second term --
      the same call `tumour_burden_recist` makes about RECIST's response
      criteria.

      The two patterns are the one place this file matches text that a
      measurement's synonyms already claim, and they are patterns rather than
      synonyms for a reason beyond the validator's ambiguity rule: the event
      cascade reads `measure` before `description`, and a MACE row's
      description almost always spells the components out ("adjudicated as CV
      death, nonfatal MI, and nonfatal stroke"). With no `measure`-level match
      the cascade reached the description first and resolved the event to
      whichever single component it found there -- "Major adverse
      cardiovascular event (MACE)" came out as time to stroke, and "Major
      adverse cardiovascular events within 30 days (MACE30)" as time to death
      from any cause. Rows these patterns miss still fall through to the
      measurement's `implies_event`, which reaches this same term.

  - id: respiratory_support_escalation
    label: "Escalation of respiratory support"
    inline_label: "escalation of respiratory support"
    concept: respiratory_support
    polarity: harm
    ascertained_by: [respiratory_support]
    patterns:
      - '\btime to (intubation|mechanical ventilation|invasive ventilation)\b'
    notes: >-
      The escalation, not the weaning: "time to extubation" is a benefit event
      and directions.yaml's `event_polarity_cues` already reads it that way.

  - id: respiratory_failure
    label: "Respiratory failure"
    inline_label: "respiratory failure"
    concept: respiratory_failure
    polarity: harm
    ascertained_by: [respiratory_failure]

  - id: hospital_discharge
    label: "Hospital discharge"
    inline_label: "hospital discharge"
    concept: hospitalisation
    polarity: benefit
    ascertained_by: [hospitalisation, length_of_stay]
    patterns:
      - '\btime to (hospital |icu )?discharge\b'
      - '\btime to (be )?discharged?\b'
    notes: >-
      The benefit half of the hospitalisation concept, and required rather than
      optional once `hospitalisation` gained `implies_event:
      hospitalisation_event` in round three. Direction is event-first, so
      without a discharge event "Time to discharge" inherited the ADMISSION
      event's `harm` polarity and came out `longer_is_better` -- a real
      regression the round-three before/after direction diff caught on three
      rows. directions.yaml's benefit cues have listed "time to ... discharge"
      since they were written; this is the same judgment, moved to the layer
      that now decides first.

  - id: ventilator_weaning
    label: "Weaning from respiratory support"
    inline_label: "weaning from respiratory support"
    concept: respiratory_support
    polarity: benefit
    ascertained_by: [respiratory_support]
    patterns:
      - '\btime to (successful )?(extubation|weaning|liberation from (mechanical )?ventilation)\b'
      - '\btime to (be )?(extubated|weaned)\b'
    notes: >-
      Same shape as `hospital_discharge`, and for the same reason: the
      `respiratory_support` measurement's `implies_event` names the ESCALATION,
      so coming off support needs its own benefit event or it inherits the
      wrong polarity.

  # =========================================================================
  # BENEFIT EVENTS OUTSIDE ONCOLOGY
  # =========================================================================
  - id: virologic_response
    label: "Virologic response or suppression"
    inline_label: "virologic response"
    concept: pathogen_clearance
    polarity: benefit
    patterns:
      - '\btime to (sustained |confirmed )?virologic (response|suppression)\b'
      - '\btime to (sustained |confirmed )?(microbiologic|microbiological) (response|clearance)\b'

  - id: haematologic_response
    label: "Haematologic response or remission"
    inline_label: "haematologic response"
    concept: haematologic_response
    polarity: benefit
    patterns:
      - '\btime to (confirmed |sustained )?ha?ematologic (response|remission)\b'

  - id: engraftment
    label: "Engraftment"
    inline_label: "engraftment"
    concept: immune_reconstitution
    polarity: benefit
    synonyms: ["engraftment"]
    patterns:
      - '\btime to engraftment\b'

  - id: clinical_remission_onset
    label: "Onset of clinical remission"
    inline_label: "clinical remission"
    concept: global_clinical_change
    polarity: benefit
    synonyms: ["remission"]
    patterns:
      - '\btime to (clinical )?remission\b'

  # --- unresolved ----------------------------------------------------------
  - id: not_stated
    label: "Event not determinable"
    inline_label: null
    concept: not_stated
    definition: >-
      The endpoint is an event-family form (forms.yaml `event_family: true`)
      but the text does not name -- and no named-endpoint definition or
      measurement `implies_event` resolves -- what occurrence ends the clock.
      Kept explicit so an unresolved event is visible and countable, the same
      way `reference.not_stated` and `direction.not_stated` are, rather than
      leaving it a silent null.

concepts_note: >-
  `concept` here reuses measurements.yaml's concept namespace where a term
  shares one (survival, disease_progression, disease_recurrence,
  treatment_failure, tumour_response, disease_exacerbation, hospitalisation,
  rescue_medication, bleeding_event, seizure_burden, haematologic_response,
  pathogen_clearance, immune_reconstitution, global_clinical_change) and a
  plain descriptive string elsewhere (amputation, kidney_function,
  transplantation, treatment_discontinuation, fracture, not_stated). Not
  cross-validated against measurements.yaml's declared `concepts:` list --
  see vocab/README.md decision #2 and this spec's Open Question #1 on concept
  promotion; promoting `concept` to its own vocabulary is additive, not a
  reason to gate this file on it now.
