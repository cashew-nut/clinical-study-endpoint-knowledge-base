    concept: hypoglycaemia
    method: clinical_event
    domain: safety
    event_polarity: harm
    typical_ta: [metabolic_endocrine]
    synonyms: ["hypoglycemia", "hypoglycaemia", "severe hypoglycemia", "level 2 hypoglycemia",
               "glucose < 54 mg/dL"]

  - id: resting_metabolic_rate
    label: "Resting metabolic rate"
    concept: energy_expenditure
    method: indirect_calorimetry
    domain: pharmacodynamic
    default_direction: neutral
    default_scale: kcal_per_day
    synonyms: ["resting metabolic rate", "RMR", "resting energy expenditure", "REE"]

  # =========================================================================
  # CARDIOVASCULAR
