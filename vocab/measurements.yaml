# Unlike the other dimensions, MEASUREMENT has no automatic fallback. A measure
# string that matches nothing here must go to conformed.review_queue unmatched --
# never to `not_stated`, which would hide an unconformed row behind a
# conformed-looking one. `not_stated` is reachable only by an explicit reviewer
# decision via `review resolve`.
default_when_unmatched: null
on_unmatched: review_queue

coverage_on_sample:
  corpus_rows: 13542
  matched_from_measure_pct: 56.7
  matched_from_measure_or_description_pct: 64.5
  # The round-one figure was 77.8%, and the gap is NOT recall. It was synonyms
  # matched as substrings: `ess` inside "assessment" and "progression" put 9.8%
  # of all outcome rows under `epistaxis_severity_score`, `alt`/`ast` inside
  # "Health"/"Past" under `liver_enzymes`, `fa` inside "Fatigue"/"Factor" under
  # `fluorescein_angiography_findings`, `ree` inside "preeclampsia"/"-free"
  # under `resting_metabolic_rate`. matching.yaml now specifies whole-token
  # matching, and tests/test_vocab_loader.py pins each of those strings.
  round_one_reported_pct: 77.8
  round_one_figure_was_inflated_by: substring_synonym_matching
  most_frequent_terms_pct:
    adverse_event: 7.9
    tumour_burden_recist: 7.9
    vital_status: 6.7
    health_related_quality_of_life_unspecified: 3.1
    anti_drug_antibody: 2.0

