  # Serum chemistry that the cardiovascular corpus carries. Not
  # cardiovascular-specific quantities, but every diuretic, RAAS and
  # heart-failure trial reports them as safety endpoints, and they were 155
  # unmatched rows between them.

  - id: serum_creatinine
    label: "Serum creatinine"
    concept: kidney_function
    method: laboratory
    domain: safety
    default_direction: decrease_is_better
    default_scale: umol_per_l
    typical_ta: [nephrology_urology, cardiovascular]
    synonyms: ["serum creatinine", "creatinine", "plasma creatinine"]
    not_if_matches:
      - '\balbumin[\s\-]?(to[\s\-])?creatinine ratio\b'
      - '\b(u?ACR|eGFR|CKD-EPI|MDRD)\b'
    notes: >-
      80 rows, the largest single chemistry gap. Shares `kidney_function` with
      `egfr`, which is computed from it -- the same-concept join that makes a
      creatinine safety endpoint comparable with an eGFR efficacy one. The two
      vetoes are that same closeness read backwards: where the text says
      "urine albumin-to-creatinine ratio" or "eGFR (CKD-EPI creatinine
      equation)", creatinine is an INPUT to the reported quantity and not the
      endpoint, and this term is longer than `albuminuria`'s "UACR" and
      `egfr`'s "eGFR", so without the vetoes it wins both. "Creatinine
      clearance" is likewise not listed here -- it is a GFR estimate, and lives
      on `egfr`.

