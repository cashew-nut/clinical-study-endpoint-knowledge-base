    method: laboratory
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: mmol_per_l
    typical_ta: [metabolic_endocrine, cardiovascular]
    synonyms: ["LDL-C", "LDL cholesterol", "low-density lipoprotein cholesterol"]

  - id: non_hdl_cholesterol
    label: "Non-HDL cholesterol"
    concept: lipid_profile
    method: laboratory
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: mmol_per_l
    typical_ta: [metabolic_endocrine, cardiovascular]
    synonyms: ["non-HDL cholesterol", "non-HDL-C", "fasting non-HDL cholesterol"]

  - id: triglycerides
    label: "Triglycerides"
    concept: lipid_profile
    method: laboratory
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: mmol_per_l
    typical_ta: [metabolic_endocrine, cardiovascular]
    synonyms: ["triglycerides", "TG", "fasting triglycerides"]

  - id: hypoglycaemia
