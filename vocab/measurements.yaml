  - id: adverse_event
    label: "Adverse event"
    concept: adverse_event
    method: safety_reporting
    domain: safety
    event_polarity: harm
    synonyms: ["adverse event", "AE", "TEAE", "treatment-emergent adverse event", "adverse events",
               "AESI", "adverse event of special interest", "treatment emergent adverse event",
               "severity of TEAEs", "AE/ADR", "adverse drug reaction", "toxicity", "toxicities",
               "treatment-related toxicity", "treatment related toxicity"]
    patterns: ['\b(TE)?AEs?\b', '\badverse (event|reaction|experience)s?\b', '\bAESIs?\b', '\bsafety and tolerability\b',
               '\btoxicit(y|ies)\b']
    notes: >-
      The single most common measurement in a registry-wide sample. Under
      incidence_proportion it is "number of participants with a TEAE"; under
      event_count, "number of TEAEs"; under time_to_event, "time to first AESI" --
      three forms of one measurement, and a clean demonstration of the
      SAME_MEASUREMENT_DIFFERENT_FORM edge outside efficacy.

      "toxicity" is a bare word rather than a phrase, but whole-token matching
      makes it safe: `\btoxicit(y|ies)\b` requires a word boundary before the
      match, so it does not fire inside "hepatotoxicity", "cardiotoxicity",
      "neurotoxicity" or "nephrotoxicity", which are organ-specific and belong
      elsewhere (or to `not_stated` where no organ-specific term exists yet)
      rather than to this generic bucket.

