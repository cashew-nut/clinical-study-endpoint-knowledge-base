    domain: efficacy
    default_direction: increase_is_better
    default_scale: percentage
    typical_ta: [cardiovascular]
    synonyms: ["LVEF", "ejection fraction", "left ventricular ejection fraction"]

  - id: major_adverse_cardiovascular_event
    label: "Major adverse cardiovascular event (MACE)"
    concept: cardiovascular_event
    method: adjudicated_composite_event
    domain: efficacy
    event_polarity: harm
    composite: true
    typical_ta: [cardiovascular]
    synonyms: ["MACE", "major adverse cardiovascular events", "cardiovascular death, MI or stroke",
               "composite vascular event", "3-point MACE"]

  - id: heart_failure_hospitalisation
