    typical_ta: [rheumatology]
    synonyms: ["ACR20", "ACR50", "ACR70", "ACR response", "American College of Rheumatology response",
               "joint count", "tender joint count", "swollen joint count", "ACR 20"]
    patterns: ['\bACR\s?\d{2}\b', '\bACR response\b', '\b(tender|swollen) joint count\b']
    notes: >-
      The plan's reference-table fixture ("Joint count + composite"). ACR20 is a
      >=20% improvement across a defined core set; the 20 is a Threshold on this
      measurement, parsed separately, so ACR20/50/70 share one id and differ only in
      threshold value. That is deliberate -- it makes "same measurement, different
      threshold" a queryable relationship.

