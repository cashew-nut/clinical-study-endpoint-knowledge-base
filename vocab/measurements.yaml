               "Fear of Cancer Recurrence Inventory - Short Form", "Fear of Cancer Recurrence Inventory-Short Form"]
    notes: >-
      A distinct construct from `health_related_quality_of_life` (fear/worry
      about relapse, not overall QoL), so it gets its own `concept` rather than
      sharing that one -- despite being reported alongside EORTC/FACT in the
      same oncology survivorship trials.

  - id: patient_global_impression
    label: "Patient Global Impression (PGIS / PGIC)"
    inline_label: "Patient Global Impression"
    concept: global_clinical_change
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    synonyms: ["PGIS", "PGIC", "Patient Global Impression of Severity",
               "Patient Global Impression of Change", "Global Rate of Change", "GRoC"]

  - id: health_related_quality_of_life_unspecified
    label: "Health-related quality of life (instrument unspecified)"
    inline_label: "health-related quality of life"
    concept: health_related_quality_of_life
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: increase_is_better
    synonyms: ["quality of life", "QoL", "HRQoL", "health-related quality of life", "quality of life assessment"]
    not_if_matches:
      - '\bEORTC\b'
      - '\bQLQ-[A-Z0-9]+\b'
      - '\bFACT-[A-Za-z0-9]+\b'
      - '\bCANKADO\b'
      - '\bEQ-5D(-\w+)?\b'
      - '\bEQ5D\w*\b'
      - '\bSF-(36|12)\b'
      - '\bFCRI\b'
    notes: >-
      A deliberate catch-all for the very common bare "Quality of life assessment".
      Conforming to it is honest -- the concept is known, the instrument is not --
      and it keeps those rows out of the review queue while remaining easy to filter
      out of any analysis that needs a named instrument.

      The vetoes stop this catch-all from beating a named instrument on span:
      registry text routinely names the instrument alongside the generic phrase,
      e.g. "... Health-Related Quality of Life (HRQoL) as Assessed by the EORTC
      QLQ-C30", where "health-related quality of life" (30 chars) is a longer
      matched span than "EORTC QLQ-C30" (13 chars) even though the instrument is
      explicit and strictly more specific -- and the literature does write FACT-ES
      the same way ("... quality of life ... in the ... FACT-ES score ..."), so
      this is not an EORTC-only failure mode. Longest-match assumes span tracks
      specificity; here two different terms match two different true substrings
      of the same string, so the assumption breaks and has to be vetoed rather
      than out-spanned. `iwqol_lite` needs no veto -- its own long-form synonym
      ("Impact of Weight on Quality of Life", 36 chars) already out-spans this
      catch-all's longest synonym (30) on its own, which is why it alone was
      spared in round two's version of the same fix (see matching.yaml).

  # =========================================================================
  # FUNCTIONAL / PERFORMANCE STATUS
  # =========================================================================
  - id: ecog_performance_status
    label: "ECOG Performance Status"
    concept: performance_status
    method: clinician_rated_instrument
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 5]
    typical_ta: [oncology]
    synonyms: ["ECOG", "ECOG Performance Status", "ECOG PS", "Eastern Cooperative Oncology Group",
               "Eastern Cooperative Oncology Group Performance Status", "WHO Performance Status"]
    notes: >-
      0 = fully active, 5 = dead, so lower is better. WHO Performance Status is
      the same 0-5 scale under a different sponsor name and is folded in as a
      synonym. Karnofsky Performance Status (0-100, higher is better) is
      deliberately NOT a synonym here despite describing the same construct: it
      is inverse-scored, and this file keeps oppositely-scored siblings as
      separate terms rather than one catch-all (see `left_ventricular_volume`'s
      notes on why reverse remodelling stays apart from LVEF) rather than risk a
      silent direction flip -- add Karnofsky as its own term if the corpus needs
      it. Most of this measurement's occurrences will be in eligibility/
      inclusion-criteria text rather than a reported outcome, but where it IS
      the outcome ("Change from Baseline in ECOG Performance Status", "Time to
      ECOG Deterioration") it needed a term to conform to.

  # =========================================================================
  # HEALTHCARE UTILISATION
  # =========================================================================
  - id: hospitalisation
    label: "Hospitalisation"
    concept: hospitalisation
    method: clinical_event
    domain: healthcare_utilisation
    event_polarity: harm
    implies_event: hospitalisation_event
    synonyms: ["hospitalization", "hospitalisation", "rate of respiratory hospitalizations",
               "readmission", "re-hospitalization", "admission", "rehospitalization",
               "all-cause hospitalization", "unplanned hospitalization"]
    notes: >-
      `implies_event` wired in round three. events.yaml has had
      `hospitalisation_event` since it was written, and this measurement --
      which is what ascertains it -- was never pointed at it, so 279
      event-family rows carried `event: not_stated` for want of one line (324
      resolve through it now, the difference being rows the new cardiovascular
      and respiratory measurements took over). Found while measuring the
      cardio-respiratory event gap, where heart-failure and COPD
      hospitalisation endpoints made it the third most common cause of an
      unresolved event. `hospital_discharge` is the benefit counterpart, added
      immediately afterwards when this wiring flipped "Time to discharge" to
      longer_is_better -- see that event's notes.

  - id: length_of_stay
    label: "Length of stay"
    concept: length_of_stay
    method: clinical_event
    domain: healthcare_utilisation
    default_direction: decrease_is_better
    default_scale: days
    synonyms: ["length of stay", "LOS", "ICU length of stay", "hospital stay", "duration of hospitalization"]

  # =========================================================================
  # OBSTETRICS
  # =========================================================================
  - id: perinatal_composite_outcome
    label: "Perinatal composite outcome"
    concept: perinatal_outcome
    method: adjudicated_composite_event
    domain: efficacy
    event_polarity: harm
    composite: true
    typical_ta: [obstetrics_gynaecology]
    synonyms: ["perinatal composite outcome", "adverse perinatal outcome", "neonatal composite"]

  - id: gestational_age_at_delivery
    label: "Gestational age at delivery"
    concept: pregnancy_duration
    method: clinical_measurement
    domain: efficacy
    default_direction: increase_is_better
    default_scale: weeks
    typical_ta: [obstetrics_gynaecology]
    synonyms: ["gestational age at delivery", "preterm birth", "time to delivery"]

  # =========================================================================
  # UNRESOLVED
  # =========================================================================
  - id: not_stated
    label: "Measurement not determinable"
    concept: not_stated
    domain: exploratory
    definition: >-
      The text names no identifiable quantity or event. Reached only via the review
      queue; the conforming pipeline must never assign it automatically, because
      doing so would hide an unmatched row behind a conformed-looking one.
    synonyms: []

# The `concept` values used above, listed so `vocab validate` can check for typos
# and so promoting concept to its own dimension later is a mechanical change.
  # --- added in vocabulary round two ----------------------------------------
  # Every entry below is here because it appeared repeatedly in the unbiased
  # sample and matched nothing. Frequencies are sample occurrences (`measure`
  # field, vocab_review_v2.csv).

  # The standard neurocognitive battery. These five travel together in
  # schizophrenia, MS and oncology-survivorship trials and were the single
  # largest coherent cluster in the miss list (~25 sample occurrences between
  # them), all falling to no measurement at all.
  - id: hopkins_verbal_learning_test
    label: "Hopkins Verbal Learning Test - Revised (HVLT-R)"
    concept: cognitive_function
    method: performance_test
    domain: efficacy
    default_direction: increase_is_better
    default_scale: score_points
    synonyms: ["HVLT-R", "HVLT", "Hopkins Verbal Learning Test", "Hopkins Verbal Learning Test-Revised"]

  - id: brief_visuospatial_memory_test
    label: "Brief Visuospatial Memory Test - Revised (BVMT-R)"
    concept: cognitive_function
    method: performance_test
    domain: efficacy
    default_direction: increase_is_better
    default_scale: score_points
    synonyms: ["BVMT-R", "BVMT", "Brief Visuospatial Memory Test", "Brief Visuospatial Memory Test-Revised"]

  - id: trail_making_test
    label: "Trail Making Test (TMT)"
    concept: cognitive_function
    method: performance_test
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: seconds
    synonyms: ["Trail Making Test", "TMT", "Trail Making Test A", "Trail Making Test B", "TMT-A", "TMT-B"]
    notes: >-
      Scored in seconds to completion, so decrease_is_better -- the opposite of
      every other instrument in this battery. Worth its own entry rather than
      folding into cognitive_composite for exactly that reason.

  - id: controlled_oral_word_association_test
    label: "Controlled Oral Word Association Test (COWAT)"
    concept: cognitive_function
    method: performance_test
    domain: efficacy
    default_direction: increase_is_better
    default_scale: count
    synonyms: ["COWAT", "Controlled Oral Word Association Test", "verbal fluency test"]

  - id: digit_symbol_coding
    label: "Digit Symbol Coding / Symbol Digit Modalities Test"
    inline_label: "Digit Symbol Coding"
    concept: cognitive_function
    method: performance_test
    domain: efficacy
    default_direction: increase_is_better
    default_scale: score_points
    synonyms: ["Digit Symbol Coding", "Digit Symbol Substitution Test", "DSST", "Symbol Digit Modalities Test", "SDMT"]

  - id: clinician_administered_ptsd_scale
    label: "Clinician-Administered PTSD Scale for DSM-5 (CAPS-5)"
    concept: ptsd_symptom_severity
    method: clinician_reported_instrument
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: score_points
    synonyms: ["CAPS-5", "CAPS-5-R", "Clinician-Administered PTSD Scale", "Clinician Administered PTSD Scale for DSM-5"]

  # Oncology surgical/pathological outcomes. "R0 resection rate" alone was 19
  # sample occurrences and matched no measurement; the FORM matched (a responder
  # proportion) but the thing being measured did not, which is precisely the case
  # that belongs in the review queue rather than being silently dropped.
  - id: surgical_margin_status
    label: "Surgical margin status (R0 / R1 / R2 resection)"
    inline_label: "surgical margin status"
    concept: surgical_completeness
    method: pathology
    domain: efficacy
    default_direction: increase_is_better
    event_polarity: benefit
    synonyms: ["R0 resection", "R0 resection rate", "margin-negative resection", "complete resection",
               "resection margin status", "negative surgical margin", "R0"]
    notes: >-
      R0 (no residual tumour microscopically) is the good outcome, so direction is
      stated for the R0 form; an R1/R2 endpoint inverts and should carry
      event_polarity harm at conform time.

  - id: pathological_response
    label: "Pathological response to neoadjuvant therapy (pCR / MPR)"
    inline_label: "pathological response"
    concept: tumour_response
    method: pathology
    domain: efficacy
    default_direction: increase_is_better
    event_polarity: benefit
    synonyms: ["pathological complete response", "pathologic complete response", "pCR",
               "major pathological response", "major pathologic response", "MPR",
               "pathological response", "tumour regression grade", "tumor regression grade", "TRG",
               "pathological downstaging"]
    notes: >-
      Deliberately separate from tumour_burden_recist: RECIST is a radiological
      assessment of a lesion, this is a histological assessment of a resected
      specimen, and the two are different measurements of the same concept. The
      neoadjuvant literature treats them as non-interchangeable.

  - id: biochemical_marker_normalisation
    label: "Normalisation of a disease biochemical marker"
    concept: biochemical_disease_marker
    method: laboratory
    domain: efficacy
    default_direction: increase_is_better
    event_polarity: benefit
    synonyms: ["normalization of biochemical markers", "normalisation of biochemical markers",
               "biochemical normalization", "biochemical normalisation",
               "normalization of biochemical markers of disease"]
    notes: >-
      The standard efficacy endpoint shape in inherited metabolic disease, where
      the analyte differs per disorder (plasma acylcarnitine, urine acylglycine,
      GAG excretion) but the endpoint is always "did the marker reach the normal
      range". Kept at construct level for that reason -- enumerating every analyte
      would be a vocabulary of one entry per trial.

  - id: treatment_adherence
    label: "Treatment adherence / compliance"
    inline_label: "treatment adherence"
    concept: treatment_adherence
    method: derived
    domain: healthcare_utilisation
    default_direction: increase_is_better
    default_scale: percentage
    synonyms: ["adherence", "treatment adherence", "medication adherence", "compliance",
               "protocol adherence", "adherence to treatment", "treatment compliance"]

  - id: brain_volume_mri
    label: "Brain volume on MRI"
    concept: neurodegeneration
    method: imaging
    domain: efficacy
    default_direction: increase_is_better
    default_scale: millilitres
    synonyms: ["brain volume", "whole brain volume", "brain atrophy", "hippocampal volume",
               "grey matter volume", "gray matter volume", "percent brain volume change"]
    notes: >-
      increase_is_better because the endpoint is nearly always volume LOSS being
      slowed; an endpoint written as "brain atrophy" inverts, and the conforming
      pipeline should take the direction from the form (change vs rate of decline)
      rather than assuming.

  - id: disease_progression_event
    label: "Disease progression (event)"
    concept: disease_progression
    method: clinical_assessment
    domain: efficacy
    default_direction: decrease_is_better
    event_polarity: harm
    implies_event: disease_progression
    synonyms: ["disease progression", "progression of disease", "radiographic progression",
               "clinical progression", "progressive disease"]
    notes: >-
      Bare "Disease progression" was 12 sample occurrences and matched nothing:
      tumour_burden_recist covers the RECIST assessment, but progression is also an
      endpoint in non-oncology settings (IPF, CKD, MS) where RECIST is meaningless.
      This entry is the disease-agnostic event; where the text names RECIST,
      longest-match hands it to tumour_burden_recist instead.

