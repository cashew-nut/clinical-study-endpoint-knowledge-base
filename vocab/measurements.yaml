  # --- Round three: cardiovascular ------------------------------------------
  # As with the respiratory block above, every term is a repeated miss in the
  # review queue of the 38,857-row pull, and the count in `notes` is unmatched
  # `measure` rows in it. Cardiovascular was the largest area in that pull
  # (9,160 rows) and had the worst conformance of any large area (53.0%), which
  # is what this block is answering.
  #
  # THE EVENT TERMS COME FIRST, and they are measurements rather than
  # named_endpoints.yaml entries on purpose. A cardiovascular outcome trial
  # counts adjudicated occurrences -- infarction, stroke, revascularisation,
  # bleeding -- the way an oncology trial counts progressions, so each is an
  # event-shaped measurement carrying `implies_event`, exactly as `vital_status`
  # and `disease_exacerbation` already do. events.yaml gains the matching event
  # ids; per that file's cross-file synonym discipline, the wording lives here
  # and the event is reached through `implies_event` rather than by duplicating
  # every synonym in two files.

  - id: myocardial_infarction
    label: "Myocardial infarction"
    concept: cardiovascular_event
    method: adjudicated_clinical_event
    domain: efficacy
    event_polarity: harm
    implies_event: myocardial_infarction
    typical_ta: [cardiovascular]
    synonyms: ["myocardial infarction", "nonfatal myocardial infarction", "non-fatal myocardial infarction",
               "fatal myocardial infarction", "recurrent myocardial infarction", "STEMI", "NSTEMI",
               "ST-elevation myocardial infarction", "periprocedural myocardial infarction",
               "spontaneous myocardial infarction"]
    patterns:
      - '\bmyocardial infarction\b'
      - '(?-i:\bMI\b)'
    not_if_matches:
      - '\bmultiple imputation\b'
    notes: >-
      140 rows. The bare acronym is a case-sensitive pattern rather than a
      synonym so it can carry the veto: "multiple imputation (MI)" is the one
      recurring non-cardiac expansion in this corpus (11 of 241 occurrences),
      and it appears in statistical-methods prose where no cardiac reading is
      available to rescue it.

