  - id: dyspnoea_severity_score
    label: "Dyspnoea severity score"
    inline_label: "dyspnoea severity"
    concept: dyspnoea_severity
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    typical_ta: [respiratory, cardiovascular]
    synonyms: ["dyspnea", "dyspnoea", "breathlessness", "shortness of breath",
               "Borg dyspnea scale", "Borg dyspnoea scale", "modified Borg", "dyspnea severity",
               "dyspnea score", "dyspnoea score", "dyspnea VAS"]
    notes: >-
      The unnamed-instrument catch-all for breathlessness, below the two named
      instruments above on longest-match. 96 rows in `measure`, 51 more in
      `description`, and it is a heart-failure symptom as often as a
