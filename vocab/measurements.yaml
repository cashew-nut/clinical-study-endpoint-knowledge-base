    synonyms: ["stroke", "ischemic stroke", "ischaemic stroke", "hemorrhagic stroke", "haemorrhagic stroke",
               "nonfatal stroke", "non-fatal stroke", "cerebrovascular accident", "transient ischemic attack",
               "transient ischaemic attack", "TIA", "systemic embolism", "stroke or systemic embolism"]
    notes: >-
      113 rows. Distinct from `nihss` and `modified_rankin_scale`, which grade
      how bad a stroke was -- this term is the occurrence. "Stroke volume" is
      not caught here: it is longer, and longest-match hands it to
      `cardiac_output`.

