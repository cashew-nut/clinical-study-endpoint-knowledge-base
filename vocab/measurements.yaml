    notes: >-
      CANKADO is not itself a validated psychometric instrument -- it is an
      ePRO/eHealth platform (self-detecting symptom questionnaires, an EQ-VAS-style
      daily slider) used to capture HRQoL in a recurring family of breast-cancer
      trials (e.g. the AGO-B WSG PreCycle trial, NCT03220178), whose registered
      endpoints read like "time to deterioration of quality of life via CANKADO
      active". Given its own id rather than folded into the generic catch-all
      because "CANKADO" recurs by name across that trial family and is worth
      keeping queryable as its own edge; the instrument it delivers underneath is
      usually still unnamed in the registry text, hence no `score_range`.

