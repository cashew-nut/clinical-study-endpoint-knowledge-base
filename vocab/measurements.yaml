# Dimension: MEASUREMENT -- what quantity or event the endpoint is about.
#
# The dimension that answers "which studies measured the same thing with a
# different form", so it is the one worth getting right.
#
# GRAIN. Entries are at INSTRUMENT/ANALYTE level (PASI, EASI, HbA1c, FEV1), and
# each also carries a `concept` -- the underlying construct (psoriasis_severity,
# glycaemic_control, airflow_obstruction). Two levels because the interesting
# question is asked at both:
#   same measurement, different form  -> PASI change-from-baseline vs PASI75
#                                        responder            (id match)
#   same concept, different instrument -> PASI vs sPGA vs BSA  (concept match)
# The graph layer can build SAME_MEASUREMENT edges from `id` and SAME_CONCEPT edges
# from `concept` with no extra vocabulary. If concept later needs synonyms and
# definitions of its own, promote it to concepts.yaml -- the field name is already
# the join key, so that is additive.
#
# DIRECTION. `default_direction` is the polarity of the UNDERLYING QUANTITY, not of
# the endpoint. PASI is decrease_is_better because lower PASI is less psoriasis --
# a PASI75 responder endpoint is still increase_is_better, because forms.yaml's
# `higher_count_better` rule overrides. Never bake the endpoint's direction in here.
# `event_polarity` (harm | benefit) does the same job for measurements that are
# events rather than quantities, and drives longer_is_better vs shorter_is_better
# on time-to-event forms. A measurement can carry both: tumour burden is a
# continuous quantity (lower better) whose event -- progression -- is a harm.
# `direction_by_ta` overrides `default_direction` where polarity genuinely depends
# on the indication (weight falls in obesity, rises in cachexia).
#
# DOMAIN. `domain` separates efficacy from safety, PK, immunogenicity, and the
# rest. Roughly a third of registry outcomes are not efficacy; naming them lets a
# query say `WHERE domain = 'efficacy'` in one predicate instead of drowning the
# review queue in adverse-event rows that were never going to be efficacy
# endpoints. Values: efficacy, safety, pharmacokinetic, pharmacodynamic,
# immunogenicity, patient_reported, healthcare_utilisation, exploratory.
#
# COVERAGE. This file will never cover the corpus by exact match, and is not meant
# to. In the 500-study sample the `measure` field is close to unique per trial: the
# 500 most frequent distinct strings account for only about a quarter of outcome
# rows. So entries are written to be matched via `synonyms` and `patterns` against a
# normalised string, with the semantic fallback and the review queue as the
# designed escape valves. Adding a term is a file edit plus `vocab validate`, never
# an automatic write.

version: 1
dimension: measurement
terms:

  # =========================================================================
  # ONCOLOGY
  # =========================================================================
  - id: tumour_burden_recist
    label: "Tumour burden (RECIST)"
    concept: tumour_burden
    method: imaging_recist
    domain: efficacy
    default_direction: decrease_is_better
    event_polarity: harm
    typical_ta: [oncology]
    synonyms: ["RECIST", "objective response", "objective response rate", "ORR", "overall response rate",
               "tumour response", "tumor response", "disease control rate", "DCR", "target lesion",
               "sum of diameters", "complete response", "partial response", "best overall response"]
    patterns:
      - '\b(objective|overall|complete|partial|best overall) response\b'
      - '\bdisease control (rate)?\b'
      - '\bRECIST\b'
    notes: >-
      The plan's reference table names this as the measurement shared by PFS and
      ORR; that shared id is what makes them a SAME_MEASUREMENT_DIFFERENT_FORM pair.
      The >=30% decrease in the sum of diameters that defines a RECIST partial
      response is a Threshold on this measurement, parsed separately -- it is a
      convention of the criteria, not part of the term. PFS/rPFS/TTP/DOR/TTR --
      the endpoint NAMES built on this measurement -- moved to
      named_endpoints.yaml with docs/EVENT_SEMANTICS_SPEC.md; this measurement
      id is unaffected (still the PFS<->ORR join key) -- only the synonyms that
      named the endpoint, rather than the assessment, moved with them.

  - id: vital_status
    label: "Vital status (death from any cause)"
    inline_label: "vital status"
    concept: survival
    method: clinical_event
    domain: efficacy
    event_polarity: harm
    implies_event: death_any_cause
    synonyms: ["death", "mortality", "all-cause mortality", "death rate",
               "in-hospital mortality", "28-day mortality", "transplant-related mortality"]
    patterns:
      - '\b(all[- ]cause |in[- ]hospital )?mortality\b'
    notes: >-
      Under time_to_event this yields longer_is_better (OS); under
      incidence_proportion, decrease_is_better (30-day mortality); under
      event_free_rate_at_timepoint, increase_is_better (2-year OS rate). One
      measurement, three directions, all derived -- which is the point of keeping
      direction out of this file. "Overall survival"/"OS"/"time to death" and the
      bare "survival" synonym moved out with docs/EVENT_SEMANTICS_SPEC.md -- the
      first two into named_endpoints.yaml's `os` definition, "time to death" into
      events.yaml's `death_any_cause`, and bare "survival" dropped rather than
      migrated: it named no specific endpoint, and once the sharper PFS/DFS-name
      synonyms it used to lose length-ties to were gone, it was a false-match
      risk on any "...-free survival" text.

  - id: disease_recurrence
    label: "Disease recurrence or relapse"
    concept: disease_recurrence
    method: clinical_event
    domain: efficacy
    event_polarity: harm
    implies_event: disease_recurrence
    typical_ta: [oncology, haematology]
    synonyms: ["recurrence rate", "locoregional recurrence"]
    patterns:
      - '\b(locoregional |axillary |distant )?recurrence\b'
      - '\brelapse\b'
    notes: >-
      "Disease-free survival"/DFS/RFS/EFS/LFS and their disease-specific
      spellings (iBCFS, GFFS) -- the endpoint NAMES built on this measurement
      -- moved to named_endpoints.yaml's `dfs`/`efs` definitions with
      docs/EVENT_SEMANTICS_SPEC.md, along with the `[- ]free survival` pattern
      that used to match them (which, as a pre-existing latent defect this
      migration surfaced, also matched "progression-free survival" -- PFS's
      territory, a different measurement -- whenever nothing more specific
      claimed the string first). This id is unaffected: rows still resolve
      here, now via `named_endpoint` provenance instead of a direct
      synonym/pattern match.

  - id: treatment_failure
    label: "Treatment failure / need for subsequent therapy"
    inline_label: "treatment failure"
    concept: treatment_failure
    method: clinical_event
    domain: efficacy
    event_polarity: harm
    implies_event: treatment_failure
    typical_ta: [oncology]
    synonyms: ["treatment failure"]
    notes: >-
      "Failure-free survival"/FFS/TFST/TSST/"time to next treatment" -- the
      endpoint NAMES built on this measurement -- moved to
      named_endpoints.yaml's `ffs`/`tfst` definitions with
      docs/EVENT_SEMANTICS_SPEC.md. This id is unaffected: rows still resolve
      here, now via `named_endpoint` provenance instead of a direct
      synonym/pattern match.

  - id: minimal_residual_disease
    label: "Minimal residual disease"
    concept: residual_disease
    method: flow_cytometry_or_molecular
    domain: efficacy
    default_direction: decrease_is_better
    typical_ta: [oncology, haematology]
    synonyms: ["MRD", "minimal residual disease", "measurable residual disease", "MRD negativity"]

  - id: haematologic_response
    label: "Haematologic response"
    concept: haematologic_response
    method: laboratory_composite
    domain: efficacy
    default_direction: increase_is_better
    typical_ta: [oncology, haematology]
    synonyms: ["clinicohematologic response", "durable clinicohematologic response", "DCR (haematologic)",
               "durable partial clinicohematologic response", "DPR", "haematologic response", "hematologic response"]

  - id: prostate_specific_antigen
    label: "Prostate-specific antigen (PSA)"
    concept: tumour_marker
    method: laboratory
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: ng_per_ml
    typical_ta: [oncology]
    synonyms: ["PSA", "prostate-specific antigen", "PSA response", "PSA50"]

  # =========================================================================
  # RESPIRATORY
  # =========================================================================
  - id: fev1
    label: "Forced expiratory volume in 1 second (FEV1)"
    concept: airflow_obstruction
    method: spirometry
    domain: efficacy
    default_direction: increase_is_better
    default_scale: litres
    typical_ta: [respiratory]
    synonyms: ["FEV1", "FEV₁", "forced expiratory volume in 1 second", "forced expiratory volume in one second",
               "pre-bronchodilator FEV1", "post-bronchodilator FEV1", "trough FEV1", "percent predicted FEV1",
               "ppFEV1", "FEV1%"]
    patterns:
      - '\bFEV\s?[1₁]\b'
      - '\bforced expiratory volume\b'
    notes: >-
      The plan's reference-table fixture for change-from-baseline. Percent-predicted
      variants share this measurement and differ only in Reference
      (predicted_normal) and Scale -- do not create a second term for them.

  - id: fvc
    label: "Forced vital capacity (FVC)"
    concept: lung_volume
    method: spirometry
    domain: efficacy
    default_direction: increase_is_better
    default_scale: millilitres
    typical_ta: [respiratory]
    synonyms: ["FVC", "forced vital capacity", "percent predicted FVC", "FVC% pred", "pFVC", "%pFVC",
               "ppFVC", "FVC%", "slow vital capacity"]
    patterns: ['\bFVC\b', '\bforced vital capacity\b']

  - id: dlco
    label: "Diffusing capacity for carbon monoxide (DLCO)"
    concept: gas_transfer
    method: spirometry
    domain: efficacy
    default_direction: increase_is_better
    default_scale: percent_predicted
    typical_ta: [respiratory]
    synonyms: ["DLCO", "DLco", "diffusing capacity", "%pDLco", "transfer factor", "TLCO"]

  - id: six_minute_walk_distance
    label: "6-minute walk distance (6MWD)"
    inline_label: "6-minute walk distance"
    concept: exercise_capacity
    method: field_exercise_test
    domain: efficacy
    default_direction: increase_is_better
    default_scale: metres
    typical_ta: [respiratory, cardiovascular, rare_genetic]
    synonyms: ["6MWD", "6MWT", "6 minute walk test", "six minute walk", "6-minute walk distance",
               "six-minute walk distance", "6-min walk distance"]
    patterns: ['\b6[- ]?min(ute)?[- ]walk\b', '\b6MW[DT]\b']

  - id: asthma_control_questionnaire
    label: "Asthma Control Questionnaire (ACQ)"
    concept: asthma_control
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 6]
    mcid: 0.5
    typical_ta: [respiratory]
    synonyms: ["ACQ", "ACQ-5", "ACQ-7", "Asthma Control Questionnaire"]

  - id: asthma_quality_of_life_questionnaire
    label: "Asthma Quality of Life Questionnaire (AQLQ)"
    concept: respiratory_quality_of_life
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: increase_is_better
    default_scale: score_points
    mcid: 0.5
    typical_ta: [respiratory]
    synonyms: ["AQLQ", "AQLQ(S)-12-SA", "Asthma Quality of Life Questionnaire"]

  - id: st_georges_respiratory_questionnaire
    label: "St George's Respiratory Questionnaire (SGRQ)"
    concept: respiratory_quality_of_life
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 100]
    mcid: 4
    typical_ta: [respiratory]
    synonyms: ["SGRQ", "St George's Respiratory Questionnaire", "SGRQ-C"]

  - id: living_with_pulmonary_fibrosis_questionnaire
    label: "Living with Pulmonary Fibrosis (L-PF) questionnaire"
    concept: respiratory_quality_of_life
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    typical_ta: [respiratory]
    synonyms: ["L-PF", "Living with Pulmonary Fibrosis", "L-PF Symptoms", "L-PF Impacts", "R-Scale-PF"]

  - id: disease_exacerbation
    label: "Disease exacerbation"
    concept: disease_exacerbation
    method: clinical_event
    domain: efficacy
    event_polarity: harm
    implies_event: disease_exacerbation
    typical_ta: [respiratory, gastroenterology_hepatology, neurology]
    synonyms: ["exacerbation", "flare", "attack", "annualized exacerbation rate", "AER",
               "severe exacerbation", "moderate-to-severe exacerbation"]
    patterns: ['\bexacerbations?\b', '\bflares?\b']

  - id: oxygen_saturation
    label: "Oxygen saturation (SpO2)"
    concept: oxygenation
    method: pulse_oximetry
    domain: efficacy
    default_direction: increase_is_better
    default_scale: percentage
    typical_ta: [respiratory, anaesthesia_critical_care]
    synonyms: ["SpO2", "oxygen saturation", "SaO2", "pulse oximetry"]

  - id: lung_hrct_extent
    label: "Quantitative lung HRCT extent"
    concept: lung_fibrosis_extent
    method: imaging_hrct
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: percentage
    typical_ta: [respiratory]
    synonyms: ["total disease extent", "TDE", "reticulovascular score", "RVS", "e-Lung", "quantitative HRCT"]

  - id: epistaxis_severity_score
    label: "Epistaxis Severity Score (ESS)"
    concept: bleeding_severity
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    typical_ta: [rare_genetic]
    synonyms: ["ESS", "Epistaxis Severity Score", "NOSE HHT", "Nasal Outcome Score for Epistaxis in HHT"]

  - id: organ_support_free_days
    label: "Organ-support-free days"
    concept: organ_support_free_days
    method: clinical_event_count
    domain: efficacy
    default_direction: increase_is_better
    default_scale: days
    typical_ta: [anaesthesia_critical_care]
    synonyms: ["ventilator-free days", "vasopressor-free days", "ICU-free days", "organ support free days",
               "days alive and free of"]


  # --- Round three: respiratory ---------------------------------------------
  # Every term below is a repeated miss in the review queue of a 38,857-row pull
  # whose two largest areas are cardiovascular (9,160 rows) and respiratory
  # (7,322) -- the pull vocab/README.md's "rheumatology and respiratory are still
  # thin" gap asked for. The count in each `notes` is unmatched `measure` rows in
  # that pull, which is why the term is here rather than a guess at what a
  # respiratory trial might measure.

  - id: peak_expiratory_flow
    label: "Peak expiratory flow (PEF)"
    concept: airflow_obstruction
    method: spirometry
    domain: efficacy
    default_direction: increase_is_better
    default_scale: litres_per_minute
    typical_ta: [respiratory]
    synonyms: ["PEF", "PEFR", "peak expiratory flow", "peak expiratory flow rate", "peak flow",
               "morning PEF", "evening PEF", "AM PEF", "PM PEF"]
    notes: >-
      Shares `airflow_obstruction` with fev1 on purpose: a twice-daily diary PEF
      and a clinic FEV1 are the same construct through different instruments,
      which is exactly the concept-level join decision #2 describes. 64 rows.

  - id: static_lung_volumes
    label: "Static lung volumes (TLC, RV, FRC)"
    inline_label: "static lung volumes"
    concept: lung_volume
    method: body_plethysmography
    domain: efficacy
    default_direction: neutral
    default_scale: litres
    typical_ta: [respiratory]
    synonyms: ["total lung capacity", "TLC", "residual volume", "functional residual capacity", "FRC",
               "inspiratory capacity", "RV/TLC", "RV/TLC ratio", "static lung volumes", "lung hyperinflation",
               "body plethysmography"]
    notes: >-
      Direction is `neutral` and not increase_is_better because the constituents
      disagree: a falling RV/TLC is deflation and good, a falling inspiratory
      capacity is bad. The endpoint's own form and the reported constituent
      decide, not this term. No bare "RV" or "IC" synonym -- "RV" is the right
      ventricle throughout the cardiovascular corpus and "IC" appears as
      "95%IC" (confidence interval) and as intermittent claudication. 59 rows.

  - id: airway_resistance
    label: "Airway resistance (oscillometry)"
    inline_label: "airway resistance"
    concept: airway_resistance
    method: oscillometry
    domain: efficacy
    default_direction: decrease_is_better
    typical_ta: [respiratory]
    synonyms: ["airway resistance", "impulse oscillometry", "oscillometry", "sRaw", "siRaw",
               "specific airway resistance", "R5-R19", "R5-R20", "reactance area",
               "specific image-based airway resistance"]
    notes: >-
      Small-airway function, reported by oscillometry (R5, R5-R19) and by
      plethysmographic sRaw. Four bare tokens are deliberately omitted: "R5",
      "X5" and "AX" are letter-digit fragments that collide with dose-level and
      region labels, and "Raw" -- the plethysmographic symbol -- matched "raw
      score" in eight PROMIS and rating-scale descriptions on its first run,
      which is matching.yaml's whole-token rule doing its job and still not
      being enough. 31 rows.

  - id: lung_clearance_index
    label: "Lung clearance index (LCI)"
    concept: ventilation_inhomogeneity
    method: multiple_breath_washout
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: dimensionless
    typical_ta: [respiratory]
    synonyms: ["LCI", "lung clearance index", "LCI2.5", "LCI 2.5", "LCI5.0", "LCI 5.0",
               "multiple breath washout"]
    notes: >-
      The cystic-fibrosis and bronchiectasis lung-function endpoint, reported
      where spirometry is normal or the participant is too young for it. Thin
      in this pull (4 rows) but it travels with sweat chloride, which is not.

  - id: sweat_chloride
    label: "Sweat chloride"
    concept: cftr_function
    method: sweat_test
    domain: pharmacodynamic
    default_direction: decrease_is_better
    default_scale: mmol_per_l
    typical_ta: [respiratory, rare_genetic]
    synonyms: ["sweat chloride", "SwCl", "sweat chloride concentration", "sweat test"]
    notes: >-
      The CFTR-modulator pharmacodynamic endpoint, and the single most frequent
      unmatched respiratory string in the pull (57 rows). `domain:
      pharmacodynamic` rather than efficacy: it measures channel function, not
      how the participant is.

  - id: fractional_exhaled_nitric_oxide
    label: "Fractional exhaled nitric oxide (FeNO)"
    inline_label: "FeNO"
    concept: type_2_inflammation
    method: exhaled_breath_analysis
    domain: pharmacodynamic
    default_direction: decrease_is_better
    default_scale: parts_per_billion
    typical_ta: [respiratory]
    synonyms: ["FeNO", "FENO", "fractional exhaled nitric oxide", "exhaled nitric oxide", "eNO"]
    notes: 19 rows. Shares `type_2_inflammation` with the two eosinophil terms below.

  - id: blood_eosinophil_count
    label: "Blood eosinophil count"
    concept: type_2_inflammation
    method: laboratory
    domain: pharmacodynamic
    default_direction: decrease_is_better
    default_scale: cells_per_ul
    typical_ta: [respiratory, immunology_inflammation]
    synonyms: ["blood eosinophil count", "peripheral blood eosinophils", "blood eosinophils",
               "absolute eosinophil count", "eosinophil count"]
    notes: >-
      Separate from `sputum_inflammatory_cells` because the compartment is the
      whole point: a biologic can clear blood eosinophils without touching
      airway ones. Same concept, different instrument -- the join decision #2
      exists for. 57 rows across the two.

  - id: sputum_inflammatory_cells
    label: "Sputum inflammatory cell counts"
    inline_label: "sputum inflammatory cell counts"
    concept: type_2_inflammation
    method: induced_sputum
    domain: pharmacodynamic
    default_direction: decrease_is_better
    default_scale: percentage
    typical_ta: [respiratory]
    synonyms: ["sputum eosinophils", "sputum eosinophil count", "sputum eosinophil percentage",
               "sputum neutrophils", "sputum neutrophil count", "sputum cell count",
               "induced sputum", "sputum inflammatory biomarkers"]

  - id: sputum_production
    label: "Sputum production"
    concept: airway_secretions
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    typical_ta: [respiratory]
    synonyms: ["sputum production", "sputum volume", "sputum colour score", "sputum color score",
               "sputum viscosity", "sputum characteristics", "expectoration"]
    notes: >-
      The symptom, kept apart from `sputum_inflammatory_cells`, which is the
      same specimen read as a biomarker. Mucolytic trials measure this one.

  - id: copd_assessment_test
    label: "COPD Assessment Test (CAT)"
    concept: copd_health_status
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 40]
    mcid: 2
    typical_ta: [respiratory]
    synonyms: ["CAT", "COPD Assessment Test", "CAAT", "CAT total score"]
    not_if_matches:
      - '\bCAT scan\b'
    notes: >-
      51 rows, and the most common COPD patient-reported endpoint in the pull.
      The veto keeps the three-letter acronym off "CAT scan"; every other
      capitalised "CAT" in the corpus is this instrument.

  - id: evaluating_respiratory_symptoms
    label: "Evaluating Respiratory Symptoms in COPD (E-RS)"
    inline_label: "E-RS:COPD"
    concept: respiratory_symptom_severity
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 40]
    mcid: 2
    typical_ta: [respiratory]
    synonyms: ["E-RS", "E-RS:COPD", "E-RS COPD", "Evaluating Respiratory Symptoms", "EXACT-RS",
               "EXACT", "EXACT-PRO", "E-RS:IPF"]
    notes: 31 rows in `measure` and 44 more in `description`.

  - id: asthma_control_test
    label: "Asthma Control Test (ACT)"
    concept: asthma_control
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: increase_is_better
    default_scale: score_points
    score_range: [5, 25]
    mcid: 3
    typical_ta: [respiratory]
    synonyms: ["ACT", "Asthma Control Test", "c-ACT", "Childhood Asthma Control Test"]
    not_if_matches:
      - '\bactivated clotting time\b'
      - '\bacceptance and commitment therapy\b'
      - '\badoptive cell (therapy|transfer)\b'
    notes: >-
      Shares `asthma_control` with the ACQ, and scores the opposite way round:
      ACT rises with better control, ACQ falls. Three vetoes because "ACT" is
      the corpus's worst-behaved capitalised acronym -- activated clotting time,
      acceptance and commitment therapy, and TIL adoptive cell therapy all
      appear in it.

  - id: asthma_symptom_diary
    label: "Asthma symptom diary score"
    concept: asthma_symptom_severity
    method: patient_reported_instrument
    domain: patient_reported
    default_direction: decrease_is_better
    default_scale: score_points
    typical_ta: [respiratory]
    synonyms: ["asthma symptom score", "asthma daytime symptom diary", "ADSD",
               "asthma nighttime symptom diary", "ANSD", "asthma night-time symptom diary",
               "asthma symptom diary", "symptom-free days", "asthma daily diary"]
    notes: >-
      Distinct from `asthma_control_questionnaire`: a daily diary score is a
      symptom count over the last 24 hours, an ACQ is a weekly recall
      instrument that also asks about rescue use and lung function. 34 rows.

  - id: mmrc_dyspnoea_scale
    label: "mMRC dyspnoea scale"
    inline_label: "mMRC dyspnoea grade"
    concept: dyspnoea_severity
    method: clinician_rated_instrument
    domain: efficacy
    default_direction: decrease_is_better
    default_scale: score_points
    score_range: [0, 4]
    typical_ta: [respiratory]
    synonyms: ["mMRC", "modified Medical Research Council", "MRC dyspnoea scale", "MRC dyspnea scale",
               "mMRC dyspnoea scale", "mMRC dyspnea scale"]

  - id: transition_dyspnoea_index
    label: "Transition Dyspnoea Index (TDI)"
    concept: dyspnoea_severity
    method: clinician_rated_instrument
    domain: efficacy
    default_direction: increase_is_better
    default_scale: score_points
    score_range: [-9, 9]
    mcid: 1
    typical_ta: [respiratory]
    synonyms: ["TDI", "Transition Dyspnea Index", "Transition Dyspnoea Index", "TDI focal score",
               "Baseline Dyspnea Index", "Baseline Dyspnoea Index"]
    notes: >-
      increase_is_better, unlike every other dyspnoea instrument here: the TDI
